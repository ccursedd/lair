<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Get the current path (e.g., /thread/821e6aaf-dfa4-4a16-aac5-9bd694f639b6)
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Save the full URL to sessionStorage before redirect
        sessionStorage.setItem('redirectUrl', path + search + hash);
        
        // Redirect to the main page
        window.location.href = '/';
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
