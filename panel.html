<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lies.sh — roblox admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #060608;
  color: #fff;
  font-family: 'SF Mono', 'Fira Code', monospace;
  -webkit-font-smoothing: antialiased;
}
:root {
  --red: rgba(255,75,75,1);
  --red-dim: rgba(255,75,75,0.18);
  --blue: rgba(88,101,242,1);
  --blue-dim: rgba(88,101,242,0.15);
  --green: rgba(87,242,135,1);
  --surface: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.07);
  --text-muted: rgba(255,255,255,0.3);
  --text-dim: rgba(255,255,255,0.5);
  --text: rgba(255,255,255,0.85);
}
.auth-page { height: 100vh; display: flex; align-items: center; justify-content: center; }
.auth-box { display: flex; flex-direction: column; gap: 20px; width: 320px; background: rgba(0,0,0,0.4); padding: 30px 24px; border: 1px solid var(--border); border-radius: 12px; }
.auth-logo { font-size: 10px; letter-spacing: 8px; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 8px; }
.auth-field input {
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  color: #fff; font-family: inherit; font-size: 12px; padding: 10px 0;
  outline: none; width: 100%; text-align: center;
}
.btn-auth {
  background: transparent; border: 1px solid rgba(88,101,242,0.6);
  color: rgba(88,101,242,0.8); font-family: inherit; font-size: 10px;
  letter-spacing: 4px; padding: 12px; cursor: pointer; transition: 0.2s;
}
.btn-auth:hover { background: rgba(88,101,242,0.1); border-color: rgba(88,101,242,1);}
.err { font-size: 10px; color: rgba(255,75,75,0.8); text-align: center; }
.app { display: none; height: 100vh; flex-direction: column; }
.app.visible { display: flex; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 52px; border-bottom: 1px solid var(--border);
}
.topbar-brand { font-size: 10px; letter-spacing: 5px; color: var(--text-muted); }
.status-pill { font-size: 9px; color: var(--text-muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; background: #00000030; }
.user-tag { font-size: 10px; color: var(--text-muted); margin-right: 12px; }
.btn-sm {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); font-size: 9px; letter-spacing: 2px;
  padding: 6px 14px; cursor: pointer; margin-left: 8px;
}
.btn-sm.danger { border-color: rgba(255,75,75,0.3); color: rgba(255,75,75,0.5); }
.main { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 220px; border-right: 1px solid var(--border);
  padding: 20px 0; overflow-y: auto;
}
.sidebar-label { font-size: 8px; letter-spacing: 3px; color: rgba(255,255,255,0.18); padding: 0 16px 10px; }
.nav-item {
  padding: 9px 16px; cursor: pointer; font-size: 11px;
  color: var(--text-muted); transition: all 0.2s;
}
.nav-item:hover { background: var(--surface); }
.nav-item.active { background: var(--blue-dim); color: rgba(88,101,242,0.9); }
.nav-badge { float: right; font-size: 9px; background: var(--blue-dim); padding: 1px 7px; border-radius: 20px; }
.nav-badge.red { background: rgba(255,75,75,0.2); }
.content { flex: 1; overflow-y: auto; padding: 28px; }
.panel { display: none; }
.panel.active { display: block; }
.panel-header { display: flex; justify-content: space-between; margin-bottom: 24px; }
.panel-title { font-size: 11px; letter-spacing: 4px; color: var(--text-dim); }
.player-grid { display: flex; flex-direction: column; gap: 8px; }
.player-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 14px 18px;
  display: flex; align-items: center; gap: 16px;
}
.player-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--blue-dim); border: 1px solid rgba(88,101,242,0.3);
  display: flex; align-items: center; justify-content: center;
  font-weight: bold;
}
.player-info { flex: 1; }
.player-name { font-size: 12px; color: var(--text); }
.player-meta { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
.player-status { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; }
.player-actions { display: flex; gap: 6px; }
.act-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); font-size: 8px; letter-spacing: 2px;
  padding: 5px 12px; cursor: pointer;
}
.act-btn.kick:hover { border-color: var(--red); color: var(--red); }
.act-btn.tp:hover { border-color: rgba(88,101,242,0.5); color: rgba(88,101,242,0.8); }
.log-feed { display: flex; flex-direction: column; gap: 4px; }
.log-entry {
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 3px;
  font-size: 11px; display: flex; gap: 16px; align-items: center;
}
.log-time { color: rgba(255,255,255,0.15); min-width: 80px; }
.log-type { font-size: 8px; letter-spacing: 2px; padding: 2px 8px; border-radius: 2px; }
.log-type.join { background: rgba(87,242,135,0.15); color: var(--green); }
.log-type.leave { background: rgba(255,255,255,0.05); color: var(--text-muted); }
.empty { text-align: center; padding: 60px; color: rgba(255,255,255,0.15); font-size: 10px; letter-spacing: 2px; }
.toast {
  position: fixed; bottom: 28px; right: 28px;
  background: #0c0c10; border: 1px solid var(--border);
  padding: 12px 18px; font-size: 10px;
  display: none; z-index: 2000;
}
.toast.show { display: block; }
</style>
</head>
<body>

<div class="auth-page" id="authPage">
  <div class="auth-box">
    <div class="auth-logo">lies.sh — roblox admin</div>
    <div class="auth-field"><input type="text" id="authUser" placeholder="username / email"></div>
    <div class="auth-field"><input type="password" id="authPass" placeholder="password"></div>
    <div class="err" id="authErr"></div>
    <button class="btn-auth" id="loginBtn">— enter —</button>
    <div style="text-align:center; font-size:9px; color:#333;">demo: admin@lies.sh / admin123</div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">lies.sh</div>
      <div class="status-pill" id="serverStatus">connecting</div>
    </div>
    <div class="topbar-right">
      <span class="user-tag" id="userTag"></span>
      <button class="btn-sm" id="refreshBtn">↻ refresh</button>
      <button class="btn-sm danger" id="logoutBtn">logout</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-label">panels</div>
      <div class="nav-item active" data-panel="players">
        players <span class="nav-badge" id="playerCount">0</span>
      </div>
      <div class="nav-item" data-panel="logs">
        action log <span class="nav-badge red" id="logCount">0</span>
      </div>
    </div>

    <div class="content">
      <div class="panel active" id="panel-players">
        <div class="panel-header">
          <span class="panel-title">// active players</span>
          <button class="act-btn" id="kickAllBtn">kick all</button>
        </div>
        <div class="player-grid" id="playerGrid">
          <div class="empty">◌ no players detected</div>
        </div>
      </div>

      <div class="panel" id="panel-logs">
        <div class="panel-header">
          <span class="panel-title">// action log</span>
          <button class="act-btn" id="clearLogsBtn">clear</button>
        </div>
        <div class="log-feed" id="logFeed">
          <div class="empty">◌ no actions yet</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓</div>

<script>
// ======================= FIXED SUPABASE CONFIGURATION =======================
// Using anon key for web client (safe for frontend)
const SUPABASE_URL = 'https://oshnejscjqcwqikvyife.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zaG5lanNjanFjd3Fpa3Z5aWZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTExNjUsImV4cCI6MjA5NjI2NzE2NX0.NjF-NmLL7vGQ7siPtOULvXwKGqDqtAY2-hbtfcQDoxM';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let players = [];
let logs = [];
let autoRefreshTimer = null;
let eventChannel = null;

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Helper to create a demo admin user if not exists (so login works out of the box)
async function ensureDemoAdmin() {
  try {
    // Check if admin@lies.sh exists by trying sign-in
    const { error: signError } = await sb.auth.signInWithPassword({
      email: 'admin@lies.sh',
      password: 'admin123'
    });
    if (signError && signError.message.includes('Invalid login credentials')) {
      // create user
      const { error: createError } = await sb.auth.signUp({
        email: 'admin@lies.sh',
        password: 'admin123'
      });
      if (createError && !createError.message.includes('already registered')) {
        console.warn('Demo user creation issue:', createError);
      } else {
        console.log('Demo admin user ready');
      }
    }
  } catch(e) { console.warn(e); }
}

async function doLogin() {
  let email = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const errDiv = document.getElementById('authErr');
  
  if (!email || !password) {
    errDiv.textContent = 'fill in both fields';
    return;
  }
  // if input looks like username without @, append @temp.user (just for demo)
  if (!email.includes('@')) email = email + '@lies.sh';
  
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  
  if (error) {
    errDiv.textContent = error.message;
    return;
  }
  
  currentUser = data.user;
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  const displayName = currentUser.email.split('@')[0];
  document.getElementById('userTag').textContent = displayName;
  
  await refreshPlayers();
  await loadLogs();
  startAutoRefresh();
  subscribeToEvents();
  showToast(`Welcome ${displayName}`);
}

async function doLogout() {
  await sb.auth.signOut();
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  if (eventChannel) eventChannel.unsubscribe();
  document.getElementById('app').classList.remove('visible');
  document.getElementById('authPage').style.display = 'flex';
}

async function refreshPlayers() {
  const { data, error } = await sb
    .from('active_players')
    .select('*')
    .order('joined_at', { ascending: false });
  
  if (error) {
    console.error('Players error:', error);
    if (error.message.includes('relation') || error.code === '42P01') {
      document.getElementById('playerGrid').innerHTML = '<div class="empty">⚠️ Database tables missing. Run setup SQL (see console).</div>';
    }
    return;
  }
  players = data || [];
  renderPlayers();
}

function renderPlayers() {
  const grid = document.getElementById('playerGrid');
  const count = players.length;
  document.getElementById('playerCount').textContent = count;
  
  if (count === 0) {
    grid.innerHTML = '<div class="empty">◌ no players online</div>';
    return;
  }
  
  grid.innerHTML = players.map(p => `
    <div class="player-card">
      <div class="player-avatar">${(p.player_name || '??').substring(0,2).toUpperCase()}</div>
      <div class="player-info">
        <div class="player-name">${escapeHtml(p.player_name || 'unknown')}</div>
        <div class="player-meta">
          <span class="player-status"></span> ping: ${p.ping || 0}ms • ID: ${p.player_id}
        </div>
      </div>
      <div class="player-actions">
        <button class="act-btn tp" onclick="teleportPlayer('${p.player_id}','${escapeHtml(p.player_name)}')">tp</button>
        <button class="act-btn kick" onclick="kickPlayer('${p.player_id}','${escapeHtml(p.player_name)}')">kick</button>
      </div>
    </div>
  `).join('');
}

async function loadLogs() {
  const { data, error } = await sb
    .from('player_events')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(100);
  
  if (!error && data) {
    logs = data;
    renderLogs();
    document.getElementById('logCount').textContent = logs.length;
  } else if (error && error.code === '42P01') {
    document.getElementById('logFeed').innerHTML = '<div class="empty">⚠️ DB missing: create tables first</div>';
  }
}

function renderLogs() {
  const feed = document.getElementById('logFeed');
  if (!logs.length) {
    feed.innerHTML = '<div class="empty">◌ no actions yet</div>';
    return;
  }
  
  feed.innerHTML = logs.map(l => `
    <div class="log-entry">
      <span class="log-time">${new Date(l.created_at).toLocaleTimeString()}</span>
      <span class="log-type ${l.type}">${l.type}</span>
      <span>${escapeHtml(l.player_name || 'player')} ${l.type === 'join' ? 'joined' : 'left'}</span>
    </div>
  `).join('');
}

async function kickPlayer(id, name) {
  const msg = prompt('Kick message:', 'You have been kicked by admin');
  if (!msg) return;
  
  const { error } = await sb.from('admin_commands').insert({
    command: 'kick',
    payload: { player_id: id, player_name: name, message: msg },
    issued_by: currentUser?.email,
    executed: false
  });
  
  if (error) {
    showToast('Error: ' + error.message);
  } else {
    showToast(`Kick command sent for ${name}`);
    setTimeout(() => refreshPlayers(), 1000);
  }
}

async function teleportPlayer(id, name) {
  const { error } = await sb.from('admin_commands').insert({
    command: 'teleport',
    payload: { player_id: id, player_name: name, destination: 'admin' },
    issued_by: currentUser?.email,
    executed: false
  });
  
  if (error) {
    showToast('Error: ' + error.message);
  } else {
    showToast(`Teleport command sent for ${name}`);
  }
}

async function kickAll() {
  for (const p of players) {
    await sb.from('admin_commands').insert({
      command: 'kick',
      payload: { player_id: p.player_id, player_name: p.player_name, message: 'Kicked by admin (mass)' },
      issued_by: currentUser?.email,
      executed: false
    });
  }
  showToast(`Kick all sent to ${players.length} players`);
  setTimeout(refreshPlayers, 1500);
}

function subscribeToEvents() {
  if (eventChannel) eventChannel.unsubscribe();
  eventChannel = sb.channel('admin-realtime');
  
  eventChannel
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'player_events'
    }, (payload) => {
      console.log('New event:', payload.new);
      loadLogs();
      refreshPlayers(); // update list if join/leave
    })
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'active_players'
    }, () => {
      refreshPlayers();
    })
    .on('postgres_changes', {
      event: 'DELETE',
      schema: 'public',
      table: 'active_players'
    }, () => {
      refreshPlayers();
    })
    .subscribe((status) => {
      const statusEl = document.getElementById('serverStatus');
      if (status === 'SUBSCRIBED') {
        statusEl.innerHTML = '● live';
        statusEl.style.color = '#57f287';
      } else {
        statusEl.innerHTML = '○ connecting';
        statusEl.style.color = 'var(--text-muted)';
      }
    });
}

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(refreshPlayers, 5000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
  });
}

// setup nav
document.querySelectorAll('.nav-item').forEach(item => {
  item.onclick = () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    item.classList.add('active');
    document.getElementById(`panel-${item.dataset.panel}`).classList.add('active');
  };
});

document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('logoutBtn').onclick = doLogout;
document.getElementById('refreshBtn').onclick = () => { refreshPlayers(); loadLogs(); showToast('Refreshed'); };
document.getElementById('kickAllBtn').onclick = kickAll;
document.getElementById('clearLogsBtn').onclick = () => { logs = []; renderLogs(); showToast('Logs cleared locally'); };

// auto focus & try demo seed
ensureDemoAdmin();

// check existing session
sb.auth.getSession().then(({ data }) => {
  if (data.session) {
    currentUser = data.session.user;
    document.getElementById('authPage').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('userTag').textContent = currentUser.email.split('@')[0];
    refreshPlayers();
    loadLogs();
    startAutoRefresh();
    subscribeToEvents();
  }
});

document.getElementById('authPass').onkeypress = (e) => { if (e.key === 'Enter') doLogin(); };

// ======================== MISSING SQL TABLES FIX (automated notice) ========================
// The script will show helpful message if tables missing.
// To fix DB schema, run these SQL commands in Supabase SQL editor:

</script>

<script type="text/roblox">
--[[
-- FIXED AND WORKING ROBLOX ADMIN SCRIPT
-- Place this code in a Script inside ServerScriptService
-- Ensure HttpService is enabled (Settings -> Security -> Allow HttpRequests = true)
--]]

local HttpService = game:GetService("HttpService")
local Players = game:GetService("Players")

-- CORRECTED Supabase credentials (service role key for backend)
local SUPABASE_URL = "https://oshnejscjqcwqikvyife.supabase.co"
local SUPABASE_SERVICE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zaG5lanNjanFjd3Fpa3Z5aWZlIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDY5MTE2NSwiZXhwIjoyMDk2MjY3MTY1fQ.OcJYhoCJvYvFsANQd4UfmNIis-ity1qbxuRno3liBOo"

local HEADERS = {
    ["Content-Type"] = "application/json",
    ["apikey"] = SUPABASE_SERVICE_KEY,
    ["Authorization"] = "Bearer " .. SUPABASE_SERVICE_KEY
}

local function request(method, path, data)
    local url = SUPABASE_URL .. "/rest/v1/" .. path
    local body = data and HttpService:JSONEncode(data) or nil
    local success, response = pcall(function()
        return HttpService:RequestAsync({
            Url = url,
            Method = method,
            Headers = HEADERS,
            Body = body
        })
    end)
    if success and response and response.StatusCode < 400 then
        return true, response
    else
        warn("[ADMIN] request failed", method, path, response and response.StatusCode)
        return false
    end
end

local function onPlayerJoin(player)
    print("[ADMIN] Join: " .. player.Name)
    request("POST", "active_players?on_conflict=player_id", {
        player_id = tostring(player.UserId),
        player_name = player.Name,
        joined_at = os.date("!%Y-%m-%dT%H:%M:%SZ"),
        ping = 0
    })
    request("POST", "player_events", {
        type = "join",
        player_id = tostring(player.UserId),
        player_name = player.Name
    })
end

local function onPlayerLeave(player)
    print("[ADMIN] Leave: " .. player.Name)
    request("DELETE", "active_players?player_id=eq." .. tostring(player.UserId))
    request("POST", "player_events", {
        type = "leave",
        player_id = tostring(player.UserId),
        player_name = player.Name
    })
end

local function updatePingLoop()
    while true do
        task.wait(10)
        for _, player in ipairs(Players:GetPlayers()) do
            local ping = math.floor(player:GetNetworkPing() * 1000)
            request("PATCH", "active_players?player_id=eq." .. tostring(player.UserId), { ping = ping })
        end
    end
end

local function checkCommandsLoop()
    while true do
        task.wait(2)
        local url = SUPABASE_URL .. "/rest/v1/admin_commands?executed=eq.false&order=id.asc&limit=10"
        local success, response = pcall(function()
            return HttpService:RequestAsync({ Url = url, Method = "GET", Headers = HEADERS })
        end)
        if success and response and response.StatusCode == 200 and response.Body then
            local commands = HttpService:JSONDecode(response.Body)
            for _, cmd in ipairs(commands) do
                request("PATCH", "admin_commands?id=eq." .. cmd.id, { executed = true })
                local payload = type(cmd.payload) == "string" and HttpService:JSONDecode(cmd.payload) or cmd.payload
                if cmd.command == "kick" then
                    local plr = Players:GetPlayerByUserId(tonumber(payload.player_id))
                    if plr then plr:Kick(payload.message or "Kicked by admin") end
                elseif cmd.command == "teleport" then
                    local plr = Players:GetPlayerByUserId(tonumber(payload.player_id))
                    if plr and plr.Character and plr.Character:FindFirstChild("HumanoidRootPart") then
                        plr.Character.HumanoidRootPart.CFrame = CFrame.new(0, 10, 0)
                    end
                elseif cmd.command == "fling" then
                    local plr = Players:GetPlayerByUserId(tonumber(payload.player_id))
                    if plr and plr.Character and plr.Character:FindFirstChild("HumanoidRootPart") then
                        local hrp = plr.Character.HumanoidRootPart
                        local vel = Instance.new("BodyVelocity")
                        vel.Velocity = Vector3.new(5000, 8000, 5000)
                        vel.MaxForce = Vector3.new(1e9, 1e9, 1e9)
                        vel.Parent = hrp
                        game:GetService("Debris"):AddItem(vel, 0.3)
                    end
                end
            end
        end
    end
end

Players.PlayerAdded:Connect(onPlayerJoin)
Players.PlayerRemoving:Connect(onPlayerLeave)
for _, player in ipairs(Players:GetPlayers()) do task.spawn(onPlayerJoin, player) end
task.spawn(updatePingLoop)
task.spawn(checkCommandsLoop)

print("[ADMIN] ✅ FIXED Roblox server script loaded! Use web panel to kick/teleport.")
</script>
