<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lies.sh — roblox admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #060608;
  color: #fff;
  font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

:root {
  --red: rgba(255,75,75,1);
  --red-dim: rgba(255,75,75,0.18);
  --red-border: rgba(255,75,75,0.25);
  --blue: rgba(88,101,242,1);
  --blue-dim: rgba(88,101,242,0.15);
  --blue-border: rgba(88,101,242,0.3);
  --green: rgba(87,242,135,1);
  --green-dim: rgba(87,242,135,0.12);
  --green-border: rgba(87,242,135,0.25);
  --amber: rgba(255,180,50,1);
  --amber-dim: rgba(255,180,50,0.12);
  --surface: rgba(255,255,255,0.03);
  --surface-hover: rgba(255,255,255,0.055);
  --border: rgba(255,255,255,0.07);
  --border-bright: rgba(255,255,255,0.14);
  --text-muted: rgba(255,255,255,0.3);
  --text-dim: rgba(255,255,255,0.5);
  --text: rgba(255,255,255,0.85);
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9999; opacity: 0.5;
}

/* ── SCAN LINE ── */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  pointer-events: none; z-index: 9998;
}

/* ── AUTH ── */
.auth-page {
  height: 100vh; display: flex; align-items: center; justify-content: center;
  position: relative;
}
.auth-glow {
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(88,101,242,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.auth-box {
  display: flex; flex-direction: column; align-items: center;
  gap: 20px; width: 300px; position: relative; z-index: 1;
  animation: fadeUp 0.7s ease both;
}
.auth-logo {
  font-size: 10px; letter-spacing: 8px; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px;
}
.auth-logo span.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--blue); display: inline-block;
  box-shadow: 0 0 8px var(--blue);
  animation: pulse 2s ease infinite;
}
.auth-field { width: 100%; position: relative; }
.auth-field input {
  background: transparent; border: none;
  border-bottom: 1px solid var(--border);
  color: #fff; font-family: inherit; font-size: 12px;
  padding: 10px 0; outline: none; width: 100%;
  letter-spacing: 1.5px; text-align: center;
  transition: border-color 0.3s;
}
.auth-field input::placeholder { color: rgba(255,255,255,0.1); letter-spacing: 3px; }
.auth-field input:focus { border-color: rgba(255,255,255,0.25); }
.field-line {
  position: absolute; bottom: 0; left: 50%; width: 0; height: 1px;
  background: var(--blue); transition: width 0.35s ease, left 0.35s ease;
}
.auth-field input:focus ~ .field-line { width: 100%; left: 0; }
.err { font-size: 10px; color: rgba(255,75,75,0.8); letter-spacing: 1px; min-height: 14px; text-align: center; }
.btn-auth {
  background: transparent;
  border: 1px solid var(--blue-border);
  color: rgba(88,101,242,0.7); font-family: inherit; font-size: 10px;
  letter-spacing: 4px; text-transform: uppercase; padding: 12px 40px;
  cursor: pointer; transition: all 0.25s; border-radius: 2px; width: 100%;
}
.btn-auth:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }
.btn-auth:active { transform: scale(0.98); }

/* ── LAYOUT ── */
.app { display: none; height: 100vh; flex-direction: column; }
.app.visible { display: flex; animation: fadeUp 0.5s ease both; }

/* ── TOPBAR ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 52px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 20px; }
.topbar-brand { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--text-muted); }
.status-pill {
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-muted); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px;
}
.status-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px var(--green);
  animation: pulse 2s ease infinite;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.user-tag { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }
.btn-sm {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); font-family: inherit; font-size: 9px;
  letter-spacing: 2px; text-transform: uppercase; padding: 6px 14px;
  cursor: pointer; border-radius: 2px; transition: all 0.2s;
}
.btn-sm:hover { border-color: var(--border-bright); color: var(--text); }
.btn-sm.danger { border-color: var(--red-border); color: rgba(255,75,75,0.5); }
.btn-sm.danger:hover { color: var(--red); border-color: var(--red); background: var(--red-dim); }

/* ── MAIN ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 220px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 20px 0; flex-shrink: 0; overflow-y: auto;
}
.sidebar-section { padding: 0 16px 20px; }
.sidebar-label {
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(255,255,255,0.18); padding: 0 4px 10px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 3px; cursor: pointer;
  font-size: 11px; letter-spacing: 1px; color: var(--text-muted);
  transition: all 0.2s; position: relative;
}
.nav-item:hover { background: var(--surface-hover); color: var(--text-dim); }
.nav-item.active { background: var(--blue-dim); color: rgba(88,101,242,0.9); border: 1px solid var(--blue-border); }
.nav-item.active::before {
  content: ''; position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
  width: 2px; height: 16px; background: var(--blue); border-radius: 0 2px 2px 0;
}
.nav-icon { font-size: 14px; opacity: 0.6; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto; font-size: 9px; background: var(--blue-dim);
  border: 1px solid var(--blue-border); color: rgba(88,101,242,0.8);
  padding: 1px 7px; border-radius: 20px; letter-spacing: 0;
}
.nav-badge.red { background: var(--red-dim); border-color: var(--red-border); color: rgba(255,75,75,0.8); }

.sidebar-stats { padding: 16px; margin: 0 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
.stat-lbl { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.2); }
.stat-val { font-size: 13px; color: var(--text-dim); }
.stat-val.green { color: var(--green); }
.stat-val.red { color: var(--red); }
.stat-val.blue { color: var(--blue); }

/* ── CONTENT ── */
.content { flex: 1; overflow-y: auto; padding: 28px; }

.panel { display: none; }
.panel.active { display: block; animation: fadeUp 0.3s ease both; }

.panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.panel-title { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--text-dim); }
.panel-actions { display: flex; gap: 8px; }

/* ── PLAYERS TABLE ── */
.player-grid { display: flex; flex-direction: column; gap: 8px; }
.player-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 14px 18px;
  display: flex; align-items: center; gap: 16px;
  transition: border-color 0.2s, background 0.2s;
}
.player-card:hover { border-color: var(--border-bright); background: var(--surface-hover); }
.player-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--blue-dim); border: 1px solid var(--blue-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: rgba(88,101,242,0.8); flex-shrink: 0;
}
.player-info { flex: 1; }
.player-name { font-size: 12px; color: var(--text); letter-spacing: 0.5px; margin-bottom: 3px; }
.player-meta { font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; display: flex; gap: 12px; }
.player-meta span { display: flex; align-items: center; gap: 4px; }
.player-status {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 5px var(--green);
}
.player-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.act-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); font-family: inherit; font-size: 8px;
  letter-spacing: 2px; text-transform: uppercase; padding: 5px 12px;
  cursor: pointer; border-radius: 2px; transition: all 0.2s;
  white-space: nowrap;
}
.act-btn:hover { border-color: var(--border-bright); color: var(--text-dim); background: var(--surface-hover); }
.act-btn.kick { border-color: var(--red-border); color: rgba(255,75,75,0.5); }
.act-btn.kick:hover { color: var(--red); border-color: var(--red); background: var(--red-dim); }
.act-btn.fling { border-color: var(--amber-dim); color: rgba(255,180,50,0.4); }
.act-btn.fling:hover { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
.act-btn.tp { border-color: var(--blue-border); color: rgba(88,101,242,0.5); }
.act-btn.tp:hover { color: var(--blue); border-color: var(--blue); background: var(--blue-dim); }
.act-btn.green-btn { border-color: var(--green-border); color: rgba(87,242,135,0.5); }
.act-btn.green-btn:hover { color: var(--green); border-color: var(--green); background: var(--green-dim); }

/* ── KICK MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  display: none; align-items: center; justify-content: center; z-index: 1000;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; animation: fadeIn 0.2s ease both; }
.modal {
  background: #0c0c10; border: 1px solid var(--border-bright);
  border-radius: 6px; padding: 28px; width: 360px;
  animation: slideUp 0.25s ease both;
}
.modal-title { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; }
.modal-field { margin-bottom: 16px; }
.modal-field label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.2); display: block; margin-bottom: 8px; }
.modal-field input, .modal-field select, .modal-field textarea {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: inherit; font-size: 12px;
  padding: 10px 12px; outline: none; width: 100%; border-radius: 3px;
  transition: border-color 0.2s;
}
.modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { border-color: var(--border-bright); }
.modal-field select option { background: #0c0c10; }
.modal-field textarea { resize: none; min-height: 70px; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.modal-actions button { flex: 1; }

/* ── LOGS ── */
.log-feed { display: flex; flex-direction: column; gap: 4px; }
.log-entry {
  display: flex; gap: 16px; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
  font-size: 11px; align-items: flex-start;
}
.log-time { color: rgba(255,255,255,0.15); white-space: nowrap; flex-shrink: 0; }
.log-type {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  padding: 2px 8px; border-radius: 2px; white-space: nowrap; flex-shrink: 0;
}
.log-type.kick { background: var(--red-dim); color: rgba(255,75,75,0.8); border: 1px solid var(--red-border); }
.log-type.join { background: var(--green-dim); color: rgba(87,242,135,0.8); border: 1px solid var(--green-border); }
.log-type.leave { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
.log-type.action { background: var(--blue-dim); color: rgba(88,101,242,0.8); border: 1px solid var(--blue-border); }
.log-type.fling { background: var(--amber-dim); color: rgba(255,180,50,0.8); border: 1px solid rgba(255,180,50,0.2); }
.log-msg { color: var(--text-dim); flex: 1; }

/* ── SETTINGS ── */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.setting-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 18px;
}
.setting-card.full { grid-column: 1 / -1; }
.setting-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-bottom: 14px; }
.setting-field { margin-bottom: 12px; }
.setting-field label { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 6px; letter-spacing: 0.5px; }
.setting-field input, .setting-field select, .setting-field textarea {
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  color: var(--text); font-family: inherit; font-size: 12px;
  padding: 8px 10px; outline: none; width: 100%; border-radius: 3px;
  transition: border-color 0.2s;
}
.setting-field input:focus, .setting-field select:focus { border-color: var(--border-bright); }
.setting-field select option { background: #0c0c10; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.toggle-row:last-child { border-bottom: none; }
.toggle-lbl { font-size: 11px; color: var(--text-dim); }
.toggle {
  position: relative; width: 32px; height: 17px; cursor: pointer;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0; background: rgba(255,255,255,0.06);
  border: 1px solid var(--border); border-radius: 20px; transition: all 0.2s;
}
.toggle input:checked ~ .toggle-track { background: var(--blue-dim); border-color: var(--blue-border); }
.toggle-thumb {
  position: absolute; top: 3px; left: 3px;
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(255,255,255,0.25); transition: all 0.2s;
}
.toggle input:checked ~ .toggle-thumb { left: 18px; background: var(--blue); }
.save-btn {
  background: var(--blue-dim); border: 1px solid var(--blue-border);
  color: rgba(88,101,242,0.8); font-family: inherit; font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase; padding: 10px 28px;
  cursor: pointer; border-radius: 2px; transition: all 0.2s; margin-top: 16px;
}
.save-btn:hover { background: rgba(88,101,242,0.25); color: var(--blue); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 28px; right: 28px; z-index: 2000;
  background: #0c0c10; border: 1px solid var(--border-bright);
  border-radius: 4px; padding: 12px 18px;
  font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim);
  display: none; align-items: center; gap: 10px;
  animation: slideUp 0.25s ease both;
}
.toast.show { display: flex; }
.toast-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.toast-dot.red { background: var(--red); }
.toast-dot.amber { background: var(--amber); }

/* ── EMPTY STATE ── */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px; gap: 10px;
}
.empty-icon { font-size: 28px; opacity: 0.1; }
.empty-text { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.15); }

/* ── ANIMATIONS ── */
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth-page" id="authPage">
  <div class="auth-glow"></div>
  <div class="auth-box">
    <div class="auth-logo">
      <span class="dot"></span>
      lies.sh — roblox admin
      <span class="dot"></span>
    </div>
    <div class="auth-field">
      <input type="text" id="authUser" placeholder="username" autocomplete="username" autofocus>
      <div class="field-line"></div>
    </div>
    <div class="auth-field">
      <input type="password" id="authPass" placeholder="password" autocomplete="current-password">
      <div class="field-line"></div>
    </div>
    <div class="err" id="authErr"></div>
    <button class="btn-auth" id="loginBtn">— enter —</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">lies.sh</div>
      <div class="status-pill">
        <span class="status-dot" id="serverDot"></span>
        <span id="serverStatus">connecting</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="user-tag" id="userTag"></span>
      <button class="btn-sm" id="refreshBtn">↻ refresh</button>
      <button class="btn-sm danger" id="logoutBtn">logout</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">panels</div>
        <div class="nav-item active" data-panel="players">
          <span class="nav-icon">◈</span> players
          <span class="nav-badge" id="playerCount">0</span>
        </div>
        <div class="nav-item" data-panel="logs">
          <span class="nav-icon">◉</span> action log
          <span class="nav-badge red" id="logCount">0</span>
        </div>
        <div class="nav-item" data-panel="settings">
          <span class="nav-icon">◎</span> settings
        </div>
      </div>

      <div class="sidebar-section" style="margin-top: auto;">
        <div class="sidebar-stats">
          <div class="stat-row">
            <span class="stat-lbl">online</span>
            <span class="stat-val green" id="statOnline">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-lbl">kicked</span>
            <span class="stat-val red" id="statKicked">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-lbl">actions</span>
            <span class="stat-val blue" id="statActions">0</span>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="panel active" id="panel-players">
        <div class="panel-header">
          <span class="panel-title">// active players</span>
          <div class="panel-actions">
            <button class="act-btn" id="kickAllBtn">kick all</button>
            <button class="act-btn tp" id="tpAllBtn">tp all → me</button>
          </div>
        </div>
        <div class="player-grid" id="playerGrid">
          <div class="empty">
            <div class="empty-icon">◌</div>
            <div class="empty-text">no players detected</div>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-logs">
        <div class="panel-header">
          <span class="panel-title">// action log</span>
          <div class="panel-actions">
            <button class="act-btn" id="clearLogsBtn">clear</button>
          </div>
        </div>
        <div class="log-feed" id="logFeed">
          <div class="empty">
            <div class="empty-icon">◌</div>
            <div class="empty-text">no actions yet</div>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-settings">
        <div class="panel-header">
          <span class="panel-title">// settings</span>
        </div>
        <div class="settings-grid">
          <div class="setting-card full">
            <div class="setting-label">default kick message</div>
            <div class="setting-field">
              <textarea id="defaultKickMsg" rows="2">You have been removed from the game.</textarea>
            </div>
          </div>
          <div class="setting-card">
            <div class="setting-label">auto-actions</div>
            <div class="toggle-row">
              <span class="toggle-lbl">Auto-refresh (5s)</span>
              <label class="toggle"><input type="checkbox" id="togAutoRefresh" checked><span class="toggle-track"></span><span class="toggle-thumb"></span></label>
            </div>
          </div>
          <div class="setting-card full">
            <div class="setting-label">fling config</div>
            <div class="setting-field" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
              <div><label>Force X</label><input type="number" id="flingX" value="1000"></div>
              <div><label>Force Y</label><input type="number" id="flingY" value="2000"></div>
              <div><label>Force Z</label><input type="number" id="flingZ" value="1000"></div>
            </div>
          </div>
        </div>
        <button class="save-btn" id="saveSettingsBtn">save settings</button>
      </div>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="kickModal">
  <div class="modal">
    <div class="modal-title">// kick player</div>
    <div class="modal-field"><label>player</label><input type="text" id="kickTargetName" readonly></div>
    <div class="modal-field"><label>kick message</label><textarea id="kickMsg" rows="3"></textarea></div>
    <div class="modal-actions"><button class="act-btn" id="cancelKickBtn">cancel</button><button class="act-btn kick" id="confirmKickBtn">confirm kick</button></div>
  </div>
</div>

<div class="modal-overlay" id="tpModal">
  <div class="modal">
    <div class="modal-title">// teleport player</div>
    <div class="modal-field"><label>target</label><input type="text" id="tpTargetName" readonly></div>
    <div class="modal-field"><label>teleport to</label><select id="tpDestType"><option value="me">bring to me (admin)</option><option value="player">bring to another player</option><option value="random">random player</option><option value="coords">specific coordinates</option></select></div>
    <div id="tpPlayerField" class="modal-field" style="display:none;"><label>destination player</label><select id="tpDestPlayer"></select></div>
    <div id="tpCoordsField" class="modal-field" style="display:none;"><label>coordinates</label><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;"><input type="number" id="tpX" placeholder="X" value="0"><input type="number" id="tpY" placeholder="Y" value="0"><input type="number" id="tpZ" placeholder="Z" value="0"></div></div>
    <div class="modal-actions"><button class="act-btn" id="cancelTpBtn">cancel</button><button class="act-btn tp" id="confirmTpBtn">teleport</button></div>
  </div>
</div>

<div class="toast" id="toast"><span class="toast-dot" id="toastDot"></span><span id="toastMsg"></span></div>

<script>
const SUPABASE_URL = 'https://oshnejscjqcwqikvyife.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KYBR9PRDrb1qSLsX6ttu_w_9OB-pRGx';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let players = [];
let logs = [];
let kickTarget = null;
let tpTarget = null;
let autoRefreshTimer = null;
let sessionStats = { kicked: 0, actions: 0 };

// Helper Functions
function showToast(msg, color) {
  const toast = document.getElementById('toast');
  const dot = document.getElementById('toastDot');
  const text = document.getElementById('toastMsg');
  dot.className = 'toast-dot' + (color === 'red' ? ' red' : color === 'amber' ? ' amber' : '');
  text.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

function escHtml(s) { return String(s).replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'; }); }

function fmtTime(d) { return new Date(d).toTimeString().slice(0,8); }

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s`;
  if (diff < 3600) return `${Math.floor(diff/60)}m`;
  return `${Math.floor(diff/3600)}h`;
}

// Login
async function doLogin() {
  const email = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const errDiv = document.getElementById('authErr');
  const btn = document.getElementById('loginBtn');
  
  if (!email || !password) { errDiv.textContent = 'fill in both fields'; return; }
  
  btn.textContent = '— connecting —';
  btn.disabled = true;
  
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  
  if (error) {
    errDiv.textContent = error.message;
    btn.textContent = '— enter —';
    btn.disabled = false;
    return;
  }
  
  currentUser = data.user;
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('userTag').textContent = email.split('@')[0];
  
  loadSettings();
  refreshPlayers();
  startAutoRefresh();
  subscribeToEvents();
  showToast(`Welcome, ${email.split('@')[0]}!`);
}

async function doLogout() {
  await sb.auth.signOut();
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  document.getElementById('app').classList.remove('visible');
  document.getElementById('authPage').style.display = 'flex';
  document.getElementById('authUser').value = '';
  document.getElementById('authPass').value = '';
  document.getElementById('loginBtn').textContent = '— enter —';
  document.getElementById('loginBtn').disabled = false;
}

// Real-time Events
function subscribeToEvents() {
  sb.channel('roblox-events')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'player_events' }, payload => {
      const ev = payload.new;
      if (ev.type === 'join') {
        if (!players.find(p => p.id === ev.player_id)) {
          refreshPlayers();
        }
        addLog('join', ev.player_name, `${ev.player_name} joined the game`);
      } else if (ev.type === 'leave') {
        refreshPlayers();
        addLog('leave', ev.player_name, `${ev.player_name} left the game`);
      }
    })
    .subscribe(status => {
      const dot = document.getElementById('serverDot');
      const lbl = document.getElementById('serverStatus');
      if (status === 'SUBSCRIBED') {
        dot.style.background = 'var(--green)';
        lbl.textContent = 'live';
      } else {
        dot.style.background = 'rgba(255,180,50,0.8)';
        lbl.textContent = 'connecting';
      }
    });
}

// Players
async function refreshPlayers() {
  const { data, error } = await sb.from('active_players').select('*').order('joined_at', { ascending: false });
  if (!error && data) {
    players = data.map(p => ({ id: p.player_id, name: p.player_name, joined: p.joined_at, ping: p.ping || 0 }));
    renderPlayers();
  }
}

function renderPlayers() {
  const grid = document.getElementById('playerGrid');
  const count = players.length;
  document.getElementById('playerCount').textContent = count;
  document.getElementById('statOnline').textContent = count;
  
  if (count === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">◌</div><div class="empty-text">no players online</div></div>`;
    return;
  }
  
  grid.innerHTML = players.map(p => {
    const initials = p.name.substring(0, 2).toUpperCase();
    return `<div class="player-card">
      <div class="player-avatar">${initials}</div>
      <div class="player-info">
        <div class="player-name">${escHtml(p.name)}</div>
        <div class="player-meta">
          <span><span class="player-status"></span> online</span>
          <span>⌁ ${p.ping}ms</span>
        </div>
      </div>
      <div class="player-actions">
        <button class="act-btn tp" onclick="openTpModal('${p.id}','${escHtml(p.name)}')">teleport</button>
        <button class="act-btn fling" onclick="flingPlayer('${p.id}','${escHtml(p.name)}')">fling</button>
        <button class="act-btn green-btn" onclick="bringToMe('${p.id}','${escHtml(p.name)}')">→ me</button>
        <button class="act-btn kick" onclick="openKickModal('${p.id}','${escHtml(p.name)}')">kick</button>
      </div>
    </div>`;
  }).join('');
}

// Commands
async function sendCommand(cmd, payload) {
  const { error } = await sb.from('admin_commands').insert({
    command: cmd,
    payload: payload,
    issued_by: currentUser?.email || 'admin',
    executed: false
  });
  if (error) showToast(`Error: ${error.message}`, 'red');
}

async function flingPlayer(id, name) {
  const x = Number(document.getElementById('flingX').value) || 1000;
  const y = Number(document.getElementById('flingY').value) || 2000;
  const z = Number(document.getElementById('flingZ').value) || 1000;
  await sendCommand('fling', { player_id: id, player_name: name, force: { x, y, z } });
  sessionStats.actions++;
  document.getElementById('statActions').textContent = sessionStats.actions;
  addLog('fling', name, `Flung ${name} with force (${x}, ${y}, ${z})`);
  showToast(`Flung ${name}`, 'amber');
}

async function bringToMe(id, name) {
  await sendCommand('teleport', { player_id: id, player_name: name, destination: 'admin' });
  sessionStats.actions++;
  document.getElementById('statActions').textContent = sessionStats.actions;
  addLog('action', name, `Brought ${name} to admin`);
  showToast(`Brought ${name} to you`);
}

async function kickAll() {
  if (!players.length) return;
  const msg = document.getElementById('defaultKickMsg').value;
  for (const p of players) {
    await sendCommand('kick', { player_id: p.id, player_name: p.name, message: msg });
    addLog('kick', p.name, `Kicked ${p.name}`);
    sessionStats.kicked++;
  }
  sessionStats.actions++;
  document.getElementById('statKicked').textContent = sessionStats.kicked;
  document.getElementById('statActions').textContent = sessionStats.actions;
  refreshPlayers();
  showToast(`Kicked all players`, 'red');
}

async function tpAllToMe() {
  for (const p of players) {
    await sendCommand('teleport', { player_id: p.id, player_name: p.name, destination: 'admin' });
    addLog('action', p.name, `Teleported ${p.name} to admin`);
  }
  sessionStats.actions++;
  document.getElementById('statActions').textContent = sessionStats.actions;
  showToast(`Teleported all to you`);
}

// Kick Modal
function openKickModal(id, name) {
  kickTarget = { id, name };
  document.getElementById('kickTargetName').value = name;
  document.getElementById('kickMsg').value = document.getElementById('defaultKickMsg').value;
  document.getElementById('kickModal').classList.add('open');
}

function closeKickModal() {
  document.getElementById('kickModal').classList.remove('open');
  kickTarget = null;
}

async function confirmKick() {
  if (!kickTarget) return;
  const msg = document.getElementById('kickMsg').value.trim() || document.getElementById('defaultKickMsg').value;
  await sendCommand('kick', { player_id: kickTarget.id, player_name: kickTarget.name, message: msg });
  sessionStats.kicked++;
  sessionStats.actions++;
  document.getElementById('statKicked').textContent = sessionStats.kicked;
  document.getElementById('statActions').textContent = sessionStats.actions;
  addLog('kick', kickTarget.name, `Kicked ${kickTarget.name}: "${msg}"`);
  showToast(`Kicked ${kickTarget.name}`, 'red');
  refreshPlayers();
  closeKickModal();
}

// TP Modal
function openTpModal(id, name) {
  tpTarget = { id, name };
  document.getElementById('tpTargetName').value = name;
  const sel = document.getElementById('tpDestPlayer');
  sel.innerHTML = players.filter(p => p.id !== id).map(p => `<option value="${p.id}">${escHtml(p.name)}</option>`).join('');
  updateTpFields();
  document.getElementById('tpModal').classList.add('open');
}

function closeTpModal() {
  document.getElementById('tpModal').classList.remove('open');
  tpTarget = null;
}

function updateTpFields() {
  const type = document.getElementById('tpDestType').value;
  document.getElementById('tpPlayerField').style.display = type === 'player' ? 'block' : 'none';
  document.getElementById('tpCoordsField').style.display = type === 'coords' ? 'block' : 'none';
}

async function confirmTp() {
  if (!tpTarget) return;
  const type = document.getElementById('tpDestType').value;
  let dest, desc;
  
  if (type === 'me') { dest = { type: 'admin' }; desc = 'admin position'; }
  else if (type === 'player') {
    const sel = document.getElementById('tpDestPlayer');
    const dname = sel.options[sel.selectedIndex]?.text || 'player';
    dest = { type: 'player', player_id: sel.value };
    desc = dname;
  }
  else if (type === 'random') {
    const others = players.filter(p => p.id !== tpTarget.id);
    const r = others[Math.floor(Math.random() * others.length)];
    dest = { type: 'player', player_id: r?.id };
    desc = `random (${r?.name || '?'})`;
  }
  else {
    dest = { type: 'coords', x: +document.getElementById('tpX').value, y: +document.getElementById('tpY').value, z: +document.getElementById('tpZ').value };
    desc = `(${dest.x}, ${dest.y}, ${dest.z})`;
  }
  
  await sendCommand('teleport', { player_id: tpTarget.id, player_name: tpTarget.name, destination: dest });
  sessionStats.actions++;
  document.getElementById('statActions').textContent = sessionStats.actions;
  addLog('action', tpTarget.name, `Teleported ${tpTarget.name} → ${desc}`);
  showToast(`Teleported ${tpTarget.name}`);
  closeTpModal();
}

// Logs
function addLog(type, player, msg) {
  logs.unshift({ type, player, msg, time: new Date() });
  if (logs.length > 200) logs.pop();
  renderLogs();
  document.getElementById('logCount').textContent = logs.length;
}

function renderLogs() {
  const feed = document.getElementById('logFeed');
  if (!logs.length) {
    feed.innerHTML = `<div class="empty"><div class="empty-icon">◌</div><div class="empty-text">no actions yet</div></div>`;
    return;
  }
  feed.innerHTML = logs.map(l => `
    <div class="log-entry">
      <span class="log-time">${fmtTime(l.time)}</span>
      <span class="log-type ${l.type}">${l.type}</span>
      <span class="log-msg">${escHtml(l.msg)}</span>
    </div>
  `).join('');
}

function clearLogs() { logs = []; renderLogs(); document.getElementById('logCount').textContent = 0; showToast('Logs cleared'); }

// Settings
function saveSettings() {
  localStorage.setItem('rbx_settings', JSON.stringify({
    kickMsg: document.getElementById('defaultKickMsg').value,
    flingX: document.getElementById('flingX').value,
    flingY: document.getElementById('flingY').value,
    flingZ: document.getElementById('flingZ').value,
  }));
  showToast('Settings saved');
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('rbx_settings') || '{}');
    if (s.kickMsg) document.getElementById('defaultKickMsg').value = s.kickMsg;
    if (s.flingX) document.getElementById('flingX').value = s.flingX;
    if (s.flingY) document.getElementById('flingY').value = s.flingY;
    if (s.flingZ) document.getElementById('flingZ').value = s.flingZ;
  } catch(e) {}
}

// Navigation
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
  document.querySelector(`.nav-item[data-panel="${name}"]`).classList.add('active');
}

// Auto Refresh
function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  if (document.getElementById('togAutoRefresh').checked) {
    autoRefreshTimer = setInterval(refreshPlayers, 5000);
  }
}

// Event Listeners
document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('logoutBtn').onclick = doLogout;
document.getElementById('refreshBtn').onclick = () => { refreshPlayers(); showToast('Refreshed players'); };
document.getElementById('kickAllBtn').onclick = kickAll;
document.getElementById('tpAllBtn').onclick = tpAllToMe;
document.getElementById('clearLogsBtn').onclick = clearLogs;
document.getElementById('saveSettingsBtn').onclick = saveSettings;
document.getElementById('cancelKickBtn').onclick = closeKickModal;
document.getElementById('confirmKickBtn').onclick = confirmKick;
document.getElementById('cancelTpBtn').onclick = closeTpModal;
document.getElementById('confirmTpBtn').onclick = confirmTp;
document.getElementById('tpDestType').onchange = updateTpFields;
document.getElementById('togAutoRefresh').onchange = startAutoRefresh;

document.querySelectorAll('.nav-item').forEach(item => {
  item.onclick = () => showPanel(item.dataset.panel);
});

document.getElementById('kickModal').onclick = e => { if (e.target === e.currentTarget) closeKickModal(); };
document.getElementById('tpModal').onclick = e => { if (e.target === e.currentTarget) closeTpModal(); };

// Enter key for login
document.getElementById('authPass').onkeypress = e => { if (e.key === 'Enter') doLogin(); };
document.getElementById('authUser').onkeypress = e => { if (e.key === 'Enter') doLogin(); };

// Check existing session
sb.auth.getSession().then(({ data }) => {
  if (data.session) {
    currentUser = data.session.user;
    document.getElementById('authPage').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('userTag').textContent = currentUser.email.split('@')[0];
    loadSettings();
    refreshPlayers();
    startAutoRefresh();
    subscribeToEvents();
  }
});
</script>
</body>
</html>
