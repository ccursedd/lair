<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lair.lat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --surface: #080808;
  --surface2: #0f0f0f;
  --surface3: #161616;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --border3: rgba(255,255,255,0.25);
  --text: #ffffff;
  --text2: #aaaaaa;
  --text3: #666666;
  --accent: #ffffff;
  --danger: #ff3333;
  --r: 4px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.6;min-height:100vh;}
a{color:inherit;text-decoration:none;}
::selection{background:#fff;color:#000;}
input,textarea,select{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:var(--r);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  padding:10px 12px;
  outline:none;
  width:100%;
  transition:border .15s;
  -webkit-appearance:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--border3);}
input::placeholder,textarea::placeholder{color:var(--text3);}
button{
  cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  border:1px solid var(--border2);
  border-radius:var(--r);
  padding:9px 16px;
  transition:all .12s;
  background:transparent;
  color:var(--text2);
}
button:hover{border-color:var(--border3);color:var(--text);}
button:active{opacity:.7;}
.btn-white{background:#fff;color:#000;border-color:#fff;font-weight:600;}
.btn-white:hover{background:#e0e0e0;border-color:#e0e0e0;color:#000;}
.btn-danger{color:var(--danger);border-color:rgba(255,51,51,.25);}
.btn-danger:hover{background:rgba(255,51,51,.08);border-color:rgba(255,51,51,.5);color:var(--danger);}
.btn-sm{padding:6px 12px;font-size:12px;}

/* NAV */
nav{
  position:sticky;top:0;z-index:200;
  background:rgba(0,0,0,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  height:52px;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{
  font-family:'IBM Plex Mono',monospace;
  font-size:16px;font-weight:600;
  letter-spacing:-.5px;color:#fff;cursor:pointer;
}
.logo span{color:var(--text3);}
.nav-r{display:flex;align-items:center;gap:8px;}

/* AVATAR */
.av{
  width:30px;height:30px;border-radius:50%;
  background:var(--surface3);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#fff;
  font-family:'IBM Plex Mono',monospace;
  overflow:hidden;flex-shrink:0;cursor:pointer;
}
.av img{width:100%;height:100%;object-fit:cover;}
.av-lg{width:80px;height:80px;font-size:22px;font-weight:700;border:1px solid var(--border2);}

/* LAYOUT */
.layout{max-width:700px;margin:0 auto;padding:28px 18px 80px;}
.page{display:none;animation:fadeIn .15s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* FEED */
.feed-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.feed-title{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;letter-spacing:-.5px;}
.filters{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
.fbtn{
  padding:5px 12px;border-radius:2px;font-size:12px;font-weight:500;
  font-family:'IBM Plex Mono',monospace;
  background:transparent;color:var(--text3);border:1px solid transparent;cursor:pointer;
  transition:all .12s;
}
.fbtn:hover{color:var(--text2);}
.fbtn.on{color:#fff;border-color:var(--border2);background:var(--surface3);}

/* THREAD CARD */
.tcard{
  border-bottom:1px solid var(--border);
  padding:16px 0;cursor:pointer;
  transition:background .1s;
}
.tcard:first-child{border-top:1px solid var(--border);}
.tcard:hover{background:var(--surface);}
.tcard:hover .tcard-inner{padding:0 12px;}
.tcard-inner{padding:0 2px;transition:padding .1s;}
.tcard-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.tcard-author{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text3);}
.tcard-author b{color:var(--text2);font-weight:500;}
.tcard-title{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:5px;color:#fff;}
.tcard-body{font-size:13px;color:var(--text3);line-height:1.5;margin-bottom:10px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.tcard-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tag{
  display:inline-block;padding:2px 8px;
  font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:500;
  border-radius:2px;border:1px solid var(--border2);color:var(--text3);
}
.tag-sell{border-color:rgba(255,255,255,.2);color:#aaa;}
.tag-buy{border-color:rgba(255,255,255,.2);color:#aaa;}
.tag-trade{border-color:rgba(255,255,255,.2);color:#aaa;}
.tcard-stats{margin-left:auto;display:flex;gap:12px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);}

/* THREAD VIEW */
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text3);cursor:pointer;margin-bottom:20px;}
.back:hover{color:#fff;}
.thread-full{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:24px;}
.thread-full-title{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:14px;letter-spacing:-.3px;}
.thread-full-body{font-size:14px;color:var(--text2);line-height:1.7;white-space:pre-wrap;}
.price-badge{
  display:inline-flex;align-items:center;gap:10px;
  border:1px solid var(--border2);padding:10px 16px;border-radius:var(--r);
  margin:14px 0;font-family:'IBM Plex Mono',monospace;
}
.price-num{font-size:20px;font-weight:600;color:#fff;}
.price-loc{font-size:12px;color:var(--text3);}

/* COMMENTS */
.comments-hd{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.cbox{border-bottom:1px solid var(--border);padding:14px 0;}
.cbox:last-child{border-bottom:none;}
.cbox-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.cbox-author{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text2);cursor:pointer;}
.cbox-author:hover{color:#fff;}
.cbox-time{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;}
.cbox-body{font-size:13px;color:var(--text2);line-height:1.6;}
.intent-tag{display:inline-block;margin-top:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border:1px solid var(--border2);border-radius:2px;color:var(--text3);}

.write-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-top:16px;}
.write-box textarea{min-height:70px;resize:vertical;margin-bottom:10px;background:var(--surface2);}
.write-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.intents{display:flex;gap:4px;}
.ichip{
  padding:5px 10px;border-radius:2px;font-size:11px;font-family:'IBM Plex Mono',monospace;
  cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text3);transition:all .12s;
}
.ichip:hover{color:var(--text2);border-color:var(--border2);}
.ichip.on{background:var(--surface3);color:#fff;border-color:var(--border2);}

/* NEW THREAD */
.form-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;}
.form-title{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;margin-bottom:20px;}
.fg{margin-bottom:14px;}
.fl{display:block;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.type-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
.tchip{
  padding:6px 14px;border-radius:2px;font-size:12px;font-family:'IBM Plex Mono',monospace;
  cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text3);transition:all .12s;
}
.tchip:hover{color:var(--text);}
.tchip.on{background:var(--surface3);color:#fff;border-color:var(--border2);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* AUTH */
.auth-wrap{min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:40px 18px;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px;width:100%;max-width:360px;}
.auth-logo{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;text-align:center;margin-bottom:4px;}
.auth-sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:24px;font-family:'IBM Plex Mono',monospace;}
.auth-hed{font-size:15px;font-weight:600;margin-bottom:18px;}
.auth-sw{text-align:center;margin-top:14px;font-size:12px;color:var(--text3);}
.auth-sw a{color:var(--text2);cursor:pointer;text-decoration:underline;}

/* PROFILE PAGE (banner removed) */
.prof-head{
  display:flex;align-items:flex-end;gap:14px;
  padding:0 2px;
  margin-bottom:16px;
  position:relative;
  margin-top: 0;
}
.prof-av-wrap{
  position:relative;
  width:80px;height:80px;flex-shrink:0;
}
.prof-av-wrap .av-lg{
  border:3px solid var(--bg);
  background:var(--surface3);
}
.prof-info{padding-bottom:4px;flex:1;min-width:0;}
.prof-name{font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:-.3px;}
.prof-url{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin:2px 0 6px;}
.prof-bio{font-size:13px;color:var(--text2);line-height:1.5;}
.prof-stats{display:flex;gap:18px;margin-top:10px;}
.pst{display:flex;flex-direction:column;}
.pst-n{font-size:16px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:#fff;}
.pst-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
.sec-hed{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}

/* SETTINGS */
.set-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:12px;}

/* AVATAR UPLOAD */
.av-upload-area{
  display:flex;align-items:center;gap:16px;margin-bottom:14px;
}
.av-preview{
  width:64px;height:64px;border-radius:50%;
  background:var(--surface3);border:1px solid var(--border2);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:600;color:#fff;font-family:'IBM Plex Mono',monospace;
  flex-shrink:0;
}
.av-preview img{width:100%;height:100%;object-fit:cover;}
.file-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border:1px solid var(--border2);border-radius:var(--r);
  font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text2);
  cursor:pointer;transition:all .12s;background:var(--surface2);
}
.file-btn:hover{border-color:var(--border3);color:#fff;}
.file-input-hidden{display:none;}

/* ERROR/TOAST */
.err{background:rgba(255,51,51,.06);border:1px solid rgba(255,51,51,.2);color:#ff6666;font-size:12px;padding:9px 12px;border-radius:var(--r);margin-bottom:12px;}
.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--surface3);border:1px solid var(--border2);
  border-radius:var(--r);padding:11px 16px;font-size:13px;
  z-index:9999;opacity:0;transform:translateY(8px);
  transition:all .2s;pointer-events:none;max-width:280px;
  font-family:'IBM Plex Mono',monospace;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-color:rgba(255,255,255,.25);color:#fff;}
.toast.er{border-color:rgba(255,51,51,.3);color:#ff6666;}

/* EMPTY / LOADING */
.empty{text-align:center;padding:50px 20px;color:var(--text3);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.spin{display:inline-block;width:18px;height:18px;border:1.5px solid var(--border2);border-top-color:#fff;border-radius:50%;animation:sp .5s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:40px;color:var(--text3);}

@media(max-width:480px){
  .frow{grid-template-columns:1fr;}
  nav{padding:0 14px;}
  .layout{padding:18px 14px 60px;}
  .auth-box{padding:22px 18px;}
  .prof-head{flex-direction:column;align-items:flex-start;margin-top:0;}
}
</style>
</head>
<body>

<nav>
  <div class="logo" id="nav-logo">lair<span>.lat</span></div>

<!-- HOME -->

<!-- NEW THREAD -->

<!-- LOGIN -->

</div>

<!-- REGISTER -->

  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">lair.lat</div>
      <div class="auth-sub">threads & drops</div>
      <div class="auth-hed">create account</div>

      <div class="fg"><label class="fl">username</label><input id="reg-user" placeholder="yourhandle" maxlength="30"></div>
      <div class="fg"><label class="fl">email</label><input type="email" id="reg-email" placeholder="you@example.com"></div>

      <button class="btn-white" style="width:100%" onclick="doRegister()" id="reg-btn">create account</button>
      <div class="auth-sw">have an account? <a onclick="showPage('login')">sign in</a></div>
    </div>
  </div>
</div>

<!-- PROFILE -->
<div class="page layout" id="page-profile">
  <div id="prof-content"></div>
</div>

<!-- SETTINGS -->
<div class="page layout" id="page-settings">
  <div class="back" onclick="showPage('home')">← back</div>
  <div class="set-box">
    <div class="form-title">edit profile</div>

    <label class="fl">profile photo</label>
    <div class="av-upload-area">
      <div class="av-preview" id="set-av-preview">??</div>
      <div>
        <label class="file-btn" for="set-av-file">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          choose photo

    </div>

<script>
const SB_URL = 'https://flmoswqpocsufircduiy.supabase.co';
const SB_KEY = 'sb_publishable_g5hrheYjAQ2OKNjkJKPCHQ_D2f8fndS';
const sb = supabase.createClient(SB_URL, SB_KEY);

let ME = null, PROF = null, FILTER = 'all', THREAD_TYPE = 'discussion', COMMENT_INTENT = 'comment';
let pendingAvatarFile = null;

// ── BOOT WITH CLEAN URL SUPPORT ───────────────────────
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { ME = session.user; PROF = await getProfile(ME.id); }
  renderNav();

  // Get the current path without the domain
  let fullPath = window.location.pathname;
  
  // Also check if there's a saved route from 404 redirect
  const savedRoute = sessionStorage.getItem('redirectRoute');
  if (savedRoute) {
    fullPath = savedRoute;
    sessionStorage.removeItem('redirectRoute');
  }
  
  // Handle different route patterns
  if (fullPath.startsWith('/thread/')) {
    const threadId = fullPath.replace('/thread/', '');
    loadThread(threadId);
    showPage('thread');
    window.history.pushState({}, '', fullPath);
  } 
  else if (fullPath.startsWith('/users/@')) {
    const username = fullPath.replace('/users/@', '');
    loadProfilePage(username);
    showPage('profile');
    window.history.pushState({}, '', fullPath);
  }
  else if (fullPath === '/settings') {
    if (ME) showPage('settings');
    else showPage('login');
    window.history.pushState({}, '', fullPath);
  }
  else if (fullPath === '/new') {
    if (ME) showPage('new');
    else showPage('login');
    window.history.pushState({}, '', fullPath);
  }
  else {
    showPage('home');
    loadFeed();
    if (fullPath !== '/') {
      window.history.pushState({}, '', '/');
    }
  }

  sb.auth.onAuthStateChange(async (ev, sess) => {
    if (ev === 'SIGNED_IN') { ME = sess.user; PROF = await getProfile(ME.id); renderNav(); }
    if (ev === 'SIGNED_OUT') { ME = null; PROF = null; renderNav(); }
  });
}

window.addEventListener('popstate', () => { boot(); });

function pushState(path) {
  const fullPath = path.startsWith('/') ? path : '/' + path;
  window.history.pushState({}, '', fullPath);
}

// ── NAV ───────────────────────────────────────────────
function renderNav() {
  document.getElementById('nav-logo').onclick = () => { 
    pushState('');
    showPage('home'); 
    loadFeed(); 
  };
  const nr = document.getElementById('nav-r');
  const nb = document.getElementById('new-btn');
  if (ME && PROF) {
    const init = (PROF.username||'?').slice(0,2).toUpperCase();
    const imgHTML = PROF.avatar_url ? `<img src="${PROF.avatar_url}" onerror="this.style.display='none'">` : '';
    nr.innerHTML = `<div class="av" onclick="showPage('settings')" title="settings">${imgHTML}${!PROF.avatar_url?init:''}</div>`;
    if(nb) nb.style.display='inline-flex';
    fillSettings();
  } else {
    nr.innerHTML = `<button onclick="showPage('login')">sign in</button><button class="btn-white" onclick="showPage('register')">join</button>`;
    if(nb) nb.style.display='none';
  }
}

// ── PAGE ──────────────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById('page-'+id);
  if (el) el.classList.add('active');
  
  if (id === 'home') {
    pushState('');
  } else if (id === 'settings') {
    pushState('settings');
  } else if (id === 'new') {
    pushState('new');
  } else if (id === 'login') {
    pushState('login');
  } else if (id === 'register') {
    pushState('register');
  }
  
  window.scrollTo(0,0);
  if (id === 'home') loadFeed();
  if (id === 'new' && !ME) { showPage('login'); return; }
}

// ── TOAST ─────────────────────────────────────────────
let toastTimer;
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show '+type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ago(ts) {
  if(!ts) return '';
  const d = (Date.now() - new Date(ts))/1000;
  if(d<60) return 'just now';
  if(d<3600) return Math.floor(d/60)+'m ago';
  if(d<86400) return Math.floor(d/3600)+'h ago';
  if(d<604800) return Math.floor(d/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}
function hideErr(id) { document.getElementById(id).style.display='none'; }

// ── AUTH ──────────────────────────────────────────────
async function doRegister() {
  hideErr('reg-err');
  let username = document.getElementById('reg-user').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if(username.length < 2) return showErr('reg-err','username needs at least 2 characters');
  if(!email) return showErr('reg-err','email required');
  if(pass.length < 6) return showErr('reg-err','password must be at least 6 characters');

  const { data: ex } = await sb.from('profiles').select('id').eq('username',username).maybeSingle();
  if(ex) return showErr('reg-err','username taken, try another');

  const btn = document.getElementById('reg-btn');
  btn.textContent='creating...'; btn.disabled=true;
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if(error) { showErr('reg-err', error.message); btn.textContent='create account'; btn.disabled=false; return; }

  if(data.user) {
    await sb.from('profiles').insert({ id: data.user.id, username, email, created_at: new Date().toISOString() });
    ME = data.user;
    PROF = await getProfile(ME.id);
    renderNav();
    toast('welcome to lair.lat!');
    showPage('home');
  }
  btn.textContent='create account'; btn.disabled=false;
}

async function doLogin() {
  hideErr('li-err');
  const email = document.getElementById('li-email').value.trim();
  const pass = document.getElementById('li-pass').value;
  const btn = document.getElementById('li-btn');
  btn.textContent='signing in...'; btn.disabled=true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error) { showErr('li-err', error.message); btn.textContent='sign in'; btn.disabled=false; return; }
  ME = data.user; PROF = await getProfile(ME.id);
  renderNav(); toast('welcome back!'); showPage('home');
  btn.textContent='sign in'; btn.disabled=false;
}

async function doLogout() {
  await sb.auth.signOut();
  ME=null; PROF=null; pendingAvatarFile=null;
  renderNav(); toast('signed out'); showPage('home');
}

// ── PROFILE ───────────────────────────────────────────
async function getProfile(uid) {
  const { data } = await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
  return data || { id: uid, username: ME?.email?.split('@')[0]||'user' };
}

async function loadProfilePage(username) {
  showPage('profile');
  pushState(`users/@${username}`);
  
  const el = document.getElementById('prof-content');
  el.innerHTML = '<div class="loading"><div class="spin"></div></div>';
  
  username = username.replace('@', '');
  
  const { data: prof } = await sb.from('profiles').select('*').eq('username', username).maybeSingle();
  if(!prof) { 
    el.innerHTML='<div class="empty">user @' + esc(username) + ' not found</div>'; 
    return; 
  }

  const { data: threads } = await sb.from('threads').select('*, profiles(username,avatar_url)').eq('author_id', prof.id).order('created_at',{ascending:false});
  const { data: comCnt } = await sb.from('comments').select('id').eq('author_id', prof.id);

  const isOwn = ME && ME.id === prof.id;
  const init = (prof.username||'?').slice(0,2).toUpperCase();
  const avImg = prof.avatar_url ? `<img src="${esc(prof.avatar_url)}" onerror="this.style.display='none'">` : '';

  el.innerHTML = `
    <div class="back" onclick="showPage('home')">← back</div>
    <div class="prof-head">
      <div class="prof-av-wrap">
        <div class="av av-lg">${avImg}${!prof.avatar_url?init:''}</div>
      </div>
      <div class="prof-info">
        <div class="prof-name">@${esc(prof.username)}</div>
        <div class="prof-url">lair.lat/users/@${esc(prof.username)}</div>
        ${prof.bio ? `<div class="prof-bio">${esc(prof.bio)}</div>` : ''}
        <div class="prof-stats">
          <div class="pst"><div class="pst-n">${threads?.length||0}</div><div class="pst-l">threads</div></div>
          <div class="pst"><div class="pst-n">${comCnt?.length||0}</div><div class="pst-l">comments</div></div>
        </div>
        ${isOwn ? `<button onclick="showPage('settings')" style="margin-top:10px;font-size:12px;padding:6px 12px">edit profile</button>` : ''}
      </div>
    </div>
    <div class="sec-hed">threads</div>
    <div>${!threads||threads.length===0?'<div class="empty" style="padding:30px 0">no threads yet</div>':threads.map(t=>cardHTML(t,prof)).join('')}
    </div>
  `;
}

// ── SETTINGS ──────────────────────────────────────────
function fillSettings() {
  if(!PROF) return;
  const init = (PROF.username||'?').slice(0,2).toUpperCase();
  const prev = document.getElementById('set-av-preview');
  if(prev) {
    prev.innerHTML = PROF.avatar_url ? `<img src="${esc(PROF.avatar_url)}" onerror="this.style.display='none'">` : init;
  }
  if(document.getElementById('set-user')) document.getElementById('set-user').value = PROF.username||'';
  if(document.getElementById('set-bio')) document.getElementById('set-bio').value = PROF.bio||'';
}

function previewAvatar(input) {
  if(!input.files[0]) return;
  if(input.files[0].size > 2*1024*1024) { toast('image too large (max 2mb)', 'er'); input.value=''; return; }
  pendingAvatarFile = input.files[0];
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById('set-av-preview');
    prev.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;
  };
  reader.readAsDataURL(input.files[0]);
}

async function uploadFile(file, bucket, path) {
  const { data, error } = await sb.storage.from(bucket).upload(path, file, { upsert: true, contentType: file.type });
  if(error) return null;
  const { data: urlData } = sb.storage.from(bucket).getPublicUrl(path);
  return urlData.publicUrl + '?t=' + Date.now();
}

async function saveSettings() {
  hideErr('set-err');
  const username = document.getElementById('set-user').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const bio = document.getElementById('set-bio').value.trim();
  if(username.length < 2) return showErr('set-err','username needs at least 2 characters');

  const { data: ex } = await sb.from('profiles').select('id').eq('username',username).neq('id',ME.id).maybeSingle();
  if(ex) return showErr('set-err','username already taken');

  const updates = { id: ME.id, username, bio, updated_at: new Date().toISOString() };

  if(pendingAvatarFile) {
    const url = await uploadFile(pendingAvatarFile, 'avatars', `${ME.id}/avatar`);
    if(url) updates.avatar_url = url;
    else toast('avatar upload failed — check storage bucket', 'er');
  }

  const { error } = await sb.from('profiles').upsert(updates);
  if(error) return showErr('set-err', error.message);

  PROF = await getProfile(ME.id);
  pendingAvatarFile = null;
  renderNav();
  toast('profile saved!');
}

// ── FEED ──────────────────────────────────────────────
async function loadFeed() {
  const el = document.getElementById('feed');
  if(!el) return;
  el.innerHTML = '<div class="loading"><div class="spin"></div></div>';
  let q = sb.from('threads').select('*, profiles(username,avatar_url)').order('created_at',{ascending:false}).limit(60);
  if(FILTER !== 'all') q = q.eq('type', FILTER);
  const { data, error } = await q;
  if(error||!data||data.length===0) {
    el.innerHTML = `<div class="empty">${error?'could not load — run the SQL setup first':'no threads yet. be the first!'}</div>`;
    return;
  }
  el.innerHTML = data.map(t => cardHTML(t, t.profiles)).join('');
}

function cardHTML(t, prof) {
  const author = prof?.username||'unknown';
  const init = author.slice(0,2).toUpperCase();
  const avImg = prof?.avatar_url ? `<img src="${esc(prof.avatar_url)}" onerror="this.style.display='none'">` : '';
  const typeTag = t.type !== 'discussion' ? `<span class="tag tag-${t.type}">${t.type}</span>` : '';
  const tagsHTML = (t.tags||[]).slice(0,3).map(tg=>`<span class="tag">${esc(tg)}</span>`).join('');
  const priceTag = t.price ? `<span class="tag">\$${Number(t.price).toFixed(2)}</span>` : '';
  return `<div class="tcard" onclick="openThread('${t.id}')">
    <div class="tcard-inner">
      <div class="tcard-top">
        <div class="av" style="width:24px;height:24px;font-size:10px" onclick="event.stopPropagation();loadProfilePage('${esc(author)}')">${avImg}${!prof?.avatar_url?init:''}</div>
        <span class="tcard-author"><b onclick="event.stopPropagation();loadProfilePage('${esc(author)}')">@${esc(author)}</b> · ${ago(t.created_at)}</span>
      </div>
      <div class="tcard-title">${esc(t.title)}</div>
      ${t.body?`<div class="tcard-body">${esc(t.body)}</div>`:''}
      <div class="tcard-foot">${typeTag}${tagsHTML}${priceTag}<div class="tcard-stats"><span>💬 ${t.comment_count||0}</span><span>👁 ${t.view_count||0}</span></div></div>
    </div>
  </div>`;
}

document.querySelectorAll('.fbtn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    FILTER = b.dataset.f;
    loadFeed();
  };
});

// ── THREAD ────────────────────────────────────────────
async function openThread(id) {
  pushState(`thread/${id}`);
  showPage('thread');
  loadThread(id);
}

async function loadThread(id) {
  const el = document.getElementById('thread-body');
  if(!el) return;
  el.innerHTML = '<div class="loading"><div class="spin"></div></div>';

  try {
    await sb.rpc('increment_views',{thread_id:id}).catch(()=>{});
  } catch(e) {}

  const { data: t } = await sb.from('threads').select('*, profiles(username,avatar_url)').eq('id',id).maybeSingle();
  const { data: comments } = await sb.from('comments').select('*, profiles(username,avatar_url)').eq('thread_id',id).order('created_at',{ascending:true});

  if(!t) { el.innerHTML='<div class="empty">thread not found</div>'; return; }

  const prof = t.profiles;
  const author = prof?.username||'unknown';
  const init = author.slice(0,2).toUpperCase();
  const avImg = prof?.avatar_url ? `<img src="${esc(prof.avatar_url)}" onerror="this.style.display='none'">` : '';
  const isOwn = ME && ME.id === t.author_id;

  const cmtsHTML = !comments||comments.length===0
    ? '<div style="padding:20px 0;color:var(--text3);font-family:\'IBM Plex Mono\',monospace;font-size:12px">no comments yet</div>'
    : comments.map(c=>commentHTML(c)).join('');

  const writeHTML = ME
    ? `<div class="write-box">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div class="av" style="width:24px;height:24px;font-size:10px">${PROF?.avatar_url?`<img src="${esc(PROF.avatar_url)}">`:((PROF?.username||'?').slice(0,2).toUpperCase())}</div>
          <span style="font-size:12px;color:var(--text3);font-family:'IBM Plex Mono',monospace">@${esc(PROF?.username||'you')}</span>
        </div>
        <textarea id="c-text" placeholder="write a comment..."></textarea>
        <div class="write-foot">
          <div class="intents">
            <button class="ichip on" data-i="comment" onclick="pickIntent(this,'comment')">comment</button>
            <button class="ichip" data-i="buy" onclick="pickIntent(this,'buy')">want to buy</button>
            <button class="ichip" data-i="offer" onclick="pickIntent(this,'offer')">make offer</button>
          </div>
          <button class="btn-white btn-sm" onclick="postComment('${id}')">post</button>
        </div>
      </div>`
    : `<div style="text-align:center;padding:18px;border:1px solid var(--border);border-radius:var(--r);margin-top:14px">
        <div style="font-size:13px;color:var(--text3);margin-bottom:10px;font-family:'IBM Plex Mono',monospace">sign in to comment</div>
        <button class="btn-white btn-sm" onclick="showPage('login')">sign in</button>
      </div>`;

  const typeTag = t.type !== 'discussion' ? `<span class="tag">${t.type}</span>` : '';
  const tagsHTML = (t.tags||[]).map(tg=>`<span class="tag">${esc(tg)}</span>`).join('');

  el.innerHTML = `
    <div class="thread-full">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <div class="av" onclick="loadProfilePage('${esc(author)}')" style="cursor:pointer">${avImg}${!prof?.avatar_url?init:''}</div>
        <div>
          <div style="font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;color:var(--text2)" onclick="loadProfilePage('${esc(author)}')">@${esc(author)}</div>
          <div style="font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace">${ago(t.created_at)}</div>
        </div>
        ${typeTag}
        ${isOwn?`<button class="btn-danger btn-sm" onclick="delThread('${id}')" style="margin-left:auto">delete</button>`:''}
      </div>
      <div class="thread-full-title">${esc(t.title)}</div>
      ${t.price?`<div class="price-badge"><span class="price-num">\$${Number(t.price).toFixed(2)}</span>${t.location?`<span class="price-loc">· ${esc(t.location)}</span>`:''}</div>`:''}
      <div class="thread-full-body">${esc(t.body||'')}</div>
      ${tagsHTML?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:14px">${tagsHTML}</div>`:''}
    </div>
    <div class="comments-hd">comments <span style="color:var(--text3)" id="ccount">${comments?.length||0}</span></div>
    <div id="clist">${cmtsHTML}</div>
    ${writeHTML}
  `;
  COMMENT_INTENT = 'comment';
}

function commentHTML(c) {
  const prof = c.profiles;
  const author = prof?.username||'unknown';
  const init = author.slice(0,2).toUpperCase();
  const avImg = prof?.avatar_url ? `<img src="${esc(prof.avatar_url)}" onerror="this.style.display='none'">` : '';
  const isOwn = ME && ME.id === c.author_id;
  const intentMap = { buy:'wants to buy', offer:'making offer' };
  const intentTag = c.intent && c.intent !== 'comment' ? `<span class="intent-tag">${intentMap[c.intent]||c.intent}</span>` : '';
  return `<div class="cbox" id="c-${c.id}">
    <div class="cbox-top">
      <div class="av" style="width:22px;height:22px;font-size:9px;cursor:pointer" onclick="loadProfilePage('${esc(author)}')">${avImg}${!prof?.avatar_url?init:''}</div>
      <span class="cbox-author" onclick="loadProfilePage('${esc(author)}')">${esc(author)}</span>
      <span class="cbox-time">${ago(c.created_at)}</span>
      ${isOwn?`<button class="btn-danger btn-sm" style="margin-left:auto;padding:3px 8px;font-size:11px" onclick="delComment('${c.id}')">×</button>`:''}
    </div>
    <div class="cbox-body">${esc(c.body)}</div>
    ${intentTag}
  </div>`;
}

function pickIntent(el, intent) {
  COMMENT_INTENT = intent;
  document.querySelectorAll('.ichip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
}

async function postComment(threadId) {
  if(!ME) { showPage('login'); return; }
  const text = document.getElementById('c-text').value.trim();
  if(!text) return;
  const { data, error } = await sb.from('comments').insert({
    thread_id: threadId, author_id: ME.id, body: text,
    intent: COMMENT_INTENT, created_at: new Date().toISOString()
  }).select('*, profiles(username,avatar_url)').single();
  if(error) { toast('error: '+error.message,'er'); return; }
  document.getElementById('c-text').value = '';
  try {
    await sb.rpc('increment_comments',{thread_id:threadId}).catch(()=>{});
  } catch(e) {}
  const list = document.getElementById('clist');
  const noMsg = list.querySelector('div[style*="padding"]');
  if(noMsg) list.innerHTML = '';
  list.insertAdjacentHTML('beforeend', commentHTML(data));
  const cc = document.getElementById('ccount');
  if(cc) cc.textContent = parseInt(cc.textContent||0)+1;
  COMMENT_INTENT = 'comment';
}

async function delComment(id) {
  if(!confirm('delete this comment?')) return;
  await sb.from('comments').delete().eq('id',id).eq('author_id',ME.id);
  document.getElementById('c-'+id)?.remove();
  toast('deleted');
}

async function delThread(id) {
  if(!confirm('delete this thread?')) return;
  await sb.from('comments').delete().eq('thread_id',id);
  await sb.from('threads').delete().eq('id',id).eq('author_id',ME.id);
  toast('thread deleted');
  pushState('');
  showPage('home');
}

// ── NEW THREAD ────────────────────────────────────────
function pickType(el, type) {
  document.querySelectorAll('.tchip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  THREAD_TYPE = type;
  document.getElementById('nt-price-row').style.display = (type==='selling'||type==='buying')?'grid':'none';
}

async function postThread() {
  if(!ME) { showPage('login'); return; }
  hideErr('nt-err');
  const title = document.getElementById('nt-title').value.trim();
  const body = document.getElementById('nt-body').value.trim();
  const price = document.getElementById('nt-price').value;
  const loc = document.getElementById('nt-loc').value.trim();
  const tagsRaw = document.getElementById('nt-tags').value.trim();
  if(!title) return showErr('nt-err','title is required');
  if(!body) return showErr('nt-err','body is required');
  const tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean) : [];
  const btn = document.getElementById('nt-btn');
  btn.textContent='posting...'; btn.disabled=true;
  const { data, error } = await sb.from('threads').insert({
    title, body, type: THREAD_TYPE,
    price: price ? parseFloat(price) : null,
    location: loc||null, tags,
    author_id: ME.id, comment_count:0, view_count:0,
    created_at: new Date().toISOString()
  }).select().single();
  btn.textContent='post thread'; btn.disabled=false;
  if(error) return showErr('nt-err', error.message);
  ['nt-title','nt-body','nt-price','nt-loc','nt-tags'].forEach(id=>document.getElementById(id).value='');
  toast('thread posted!');
  openThread(data.id);
}

boot();
</script>
