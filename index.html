<style>
* { 
    margin:0; 
    padding:0; 
    box-sizing:border-box; 
    user-select:none; 
    cursor:crosshair !important; 
}

html, body { 
    height:100%; 
    font-family:"Courier New", monospace; 
    color:#8c8c8c; 
    background:#000; 
    overflow-x:hidden; 
    scrollbar-width: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

body::before {
    content:"";
    position:fixed;
    inset:0;
    background: radial-gradient(circle at center, transparent 20%, #000 100%);
    z-index: 5;
    pointer-events: none;
}

body::after { 
    content:""; 
    position:fixed; 
    inset:0; 
    background:rgba(0,0,0,0.85); 
    z-index:-1; 
}

::-webkit-scrollbar { display: none; }

#enterGate { 
    position:fixed; 
    inset:0; 
    background:#000; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    z-index:5000; 
}

#enterText { 
    font-size:12px; 
    letter-spacing:6px; 
    color:#555; 
    animation: pulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; 
    padding: 20px; 
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}

#enterText:hover { 
    color: #fff; 
    text-shadow: 0 0 12px rgba(255,255,255,0.3);
    transform: scale(1.02);
}

@keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
.fadeOut { animation:gateFade 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes gateFade { to { opacity:0; visibility:hidden; pointer-events:none; } }

#mascot { 
    position:fixed; 
    top:0; 
    right:12%; 
    width:520px; 
    height:100vh; 
    background:url("download.png") center top no-repeat; 
    background-size:contain; 
    opacity:0.5; 
    pointer-events:none; 
    z-index:6; 
    transform-origin: top center; 
    animation:swing 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate; 
    filter: grayscale(60%) brightness(1.3); 
}

@keyframes swing { 
    0% { transform: rotate(-3deg); } 
    100% { transform: rotate(3deg); } 
}

header { text-align:center; padding:50px 0 20px; position: relative; z-index: 10; }
.title { font-size:26px; letter-spacing:8px; font-weight:700; text-transform:uppercase; color: #777; }
.subtitle { font-size:11px; letter-spacing:3px; color: #444; margin-top:8px; }

.topLinks { position:fixed; top:25px; right:30px; font-family: Arial, sans-serif; font-size:11px; font-weight:bold; letter-spacing:2px; text-align:right; z-index:20; }
.topLinks a { display:block; color:#666; text-decoration:none; margin-bottom:10px; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
.topLinks a:hover { color:#fff; letter-spacing: 3px; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

.layout { padding:40px; display: flex; position: relative; z-index: 10;}
.rosterGrid { display:grid; grid-template-columns:repeat(2,70px); gap:25px 20px; z-index:10; }

.tile { text-align:center; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
.tile:hover { opacity:0.8; transform: scale(0.92) translateY(2px); }
.pfp { width:60px; height:60px; border:1px solid #111; background:#000 center/cover no-repeat; filter:grayscale(100%) brightness(0.65); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
.tile:hover .pfp { border-color: #555; filter:grayscale(100%) brightness(1); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.name { margin-top:6px; font-size:9px; letter-spacing:2px; color: #555; transition: 0.3s; }
.tile:hover .name { color: #ddd; }

.modal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:1000; visibility: hidden; pointer-events: none; }
.modal.open { visibility: visible; pointer-events: auto; }

.backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.8); backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.4s ease; }
.modal.open .backdrop { opacity: 1; }

.card { 
    position:relative; 
    width:550px; 
    background:#050505; 
    border:1px solid #1a1a1a; 
    display: flex; 
    min-height: 260px; 
    opacity: 0; 
    transform: scale(0.95) translateY(15px); 
    transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
    box-shadow: 0 20px 40px rgba(0,0,0,0.95);
}
.modal.open .card { opacity: 1; transform: scale(1) translateY(0); }

.cardSidebar { width: 180px; padding: 30px; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; background: #020202; align-items: center; }
.pfpBig { width:120px; height:120px; margin-bottom:20px; border:1px solid #222; background:center/cover no-repeat; filter: grayscale(100%) brightness(0.7); } 
.cardName { font-size:16px; letter-spacing:4px; font-weight:bold; color:#777; text-transform:uppercase; }

.cardMain { flex: 1; display: flex; flex-direction: column; }
.cardHeader { font-size: 9px; color: #555; letter-spacing: 3px; padding: 15px 25px; border-bottom: 1px solid #1a1a1a; background: #030303; }
.cardStatus { flex: 1; font-size:11px; line-height:1.8; padding:25px; color:#8c8c8c; background: #050505; }
.cardStatus::after { content: "_"; animation: blink 1s step-end infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.cardActions { display:grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #1a1a1a; }

.pill { padding:15px 10px; font-size:9px; letter-spacing:3px; color:#555; text-decoration:none; border-right: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; text-align: center; background: #020202; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.pill:hover { background:#0a0a0a; color:#eee; text-shadow: 0 0 5px rgba(255,255,255,0.2); }

.trail { 
    position:fixed; 
    top:0; 
    left:0; 
    width:2px; 
    height:2px; 
    background:#fff; 
    border-radius: 50%;
    pointer-events:none; 
    z-index:10000; 
    animation:fadeTrail 0.7s cubic-bezier(0.21, 1.05, 0.3, 1) forwards; 
    box-shadow: 0 0 5px rgba(255,255,255,0.8);
    will-change: transform, opacity;
}
@keyframes fadeTrail { 
    0% { opacity: 0.8; transform: translate(var(--x), var(--y)) scale(1); }
    100% { opacity: 0; transform: translate(var(--x), calc(var(--y) + 15px)) scale(0); } 
}
</style>
</head>

    <div class="rosterGrid" id="roster"></div>
</main>

<div class="modal" id="modal">
    <div class="backdrop" id="modalBackdrop"></div>
    <div class="card">
        <div class="cardSidebar">
            <div class="pfpBig" id="mPfp"></div>
            <div class="cardName" id="mName"></div>
        </div>
        <div class="cardMain">
            <div class="cardHeader">NODE_01 // SESSION_ACTIVE</div>
            <div class="cardStatus" id="mStatus"></div>

        </div>

<script>
console.log("%c[SYSTEM] Access logged. Nothing to see here.", "color:#444; font-family:monospace; font-size:11px;");

const members = [
    { name: "hoes", img: "c5c3fe2940f1bf6c395e0cc3d0dee6a5.webp", status: "i am a fucking boss g", telegram:"https://t.me/cancelplans", doxbin:"https://doxbin.com/user/ihop" },
    { name: "lure", img: "fe12bb585fa4ee0e97b950d31fe0f741.jpg", status: "i run shit g", discord:"https://discord.gg/inbirth" }
];

const roster = document.getElementById("roster");
const modal = document.getElementById("modal");
const statusBox = document.getElementById("mStatus");
let timer = null;
let keys = "";

members.forEach(m => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `<div class="pfp" style="background-image:url('${m.img}')"></div><div class="name">${m.name}</div>`;
    tile.addEventListener("click", () => showProfile(m));
    roster.appendChild(tile);
});

function showProfile(m) {
    if (timer) clearTimeout(timer); 
    
    modal.classList.add("open");
    document.getElementById("mPfp").style.backgroundImage = `url('${m.img}')`;
    document.getElementById("mName").textContent = m.name;
    document.getElementById("actions").innerHTML = "";
    
    statusBox.textContent = "";
    let i = 0;
    
    function typeChar() {
        if (i < m.status.length) {
            statusBox.textContent += m.status[i++];
            let delay = Math.random() * 40 + 30; 
            if (m.status[i - 1] === " ") delay += 50; 
            timer = setTimeout(typeChar, delay);
        }
    }
    
    typeChar();
    
    if(m.telegram) addBtn("TELEGRAM", m.telegram);
    if(m.doxbin) addBtn("DOXBIN", m.doxbin);
    if(m.discord) addBtn("DISCORD", m.discord);
}

function addBtn(txt, url) {
    const a = document.createElement("a");
    a.className = "pill";
    a.href = url;
    a.target = "_blank";
    a.textContent = txt;
    document.getElementById("actions").appendChild(a);
}

function closePop() {
    modal.classList.remove("open");
    if (timer) clearTimeout(timer);
}

document.getElementById("modalBackdrop").addEventListener("click", closePop);

document.getElementById("enterText").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("enterGate").classList.add("fadeOut");
    
    const audio = document.getElementById("ambience");
    audio.volume = 0;
    audio.play().then(() => {
        let vol = 0;
        const fadeInterval = setInterval(() => {
            if (vol < 0.2) {
                vol += 0.01;
                audio.volume = Math.min(vol, 0.2);
            } else {
                clearInterval(fadeInterval);
            }
        }, 50); 
    }).catch(err => console.log("Audio play prevented by browser."));
});

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
    if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) || (e.ctrlKey && e.key === "u")) {
        e.preventDefault();
    }
    
    keys += e.key.toLowerCase();
    if(keys.length > 10) keys = keys.slice(-10);
    if(keys.includes("void")) {
        document.body.style.filter = "invert(1)";
        setTimeout(() => document.body.style.filter = "none", 150);
        keys = "";
    }
});

let lastTrailTime = 0;
document.addEventListener("mousemove", e => {
    const now = performance.now();
    if (now - lastTrailTime < 25) return; 
    lastTrailTime = now;

    window.requestAnimationFrame(() => {
        const t = document.createElement("div");
        t.className = "trail";
        t.style.setProperty('--x', e.clientX + "px");
        t.style.setProperty('--y', e.clientY + "px");
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 700);
    });
});
</script>
